<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>昨日重现 · Ch2 接女儿放学</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden;
      position: fixed; top: 0; left: 0;
      background: #0d0805;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    canvas {
      display: block;
      position: absolute;
      touch-action: none;
    }
    /* loading 遮罩 */
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d0805;
      color: #d4b896;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .title { font-size: clamp(18px, 4vw, 28px); margin-bottom: 16px; letter-spacing: 0.1em; }
    #loading .bar-wrap {
      width: min(200px, 40vw); height: 3px;
      background: rgba(212,184,150,0.2);
      border-radius: 2px; overflow: hidden;
    }
    #loading .bar-fill {
      height: 100%; width: 0%;
      background: #d4b896;
      border-radius: 2px;
      transition: width 0.3s;
    }
    #loading .hint { font-size: clamp(11px, 2vw, 14px); margin-top: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="title">昨日重现</div>
    <div class="bar-wrap"><div class="bar-fill" id="loadBar"></div></div>
    <div class="hint" id="loadHint">正在准备记忆碎片...</div>
  </div>
  <canvas id="gameCanvas" aria-label="昨日重现第二章互动拼图"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
