<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>辨认破碎字迹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#1f1409;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#app{display:flex;flex-direction:column;height:100dvh}
#boardWrap{flex:1;margin:10px 12px 3px;overflow:hidden;border-radius:6px;background:#fcf5e6;position:relative}
#board{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#bar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px;flex-shrink:0;gap:8px;flex-wrap:wrap}
#msg{font-size:clamp(13px,2.5vw,16px);color:#d4b896;min-height:22px;flex:1;min-width:0}
#right{display:flex;align-items:center;gap:10px}
#attempts{font-size:clamp(12px,2.2vw,15px);color:#d4b896;opacity:.7;background:rgba(212,184,150,.1);padding:4px 14px;border-radius:10px;white-space:nowrap}
#toolbar{display:flex;gap:8px;flex-shrink:0}
#toolbar button{
  border:none;padding:9px 20px;border-radius:8px;font-size:clamp(13px,2.5vw,16px);
  font-weight:600;cursor:pointer;transition:transform .08s,opacity .15s;
}
#toolbar button:active{transform:scale(.93)}
.b2{background:rgba(255,255,255,.08);color:#b89a72}
.b1{background:#d4b896;color:#1f1409}

/* overlays */
.overlay{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;
}
.overlay.active{opacity:1;visibility:visible}
.card{
  background:linear-gradient(145deg,#fcf5e6,#f0deb4);border-radius:16px;padding:28px 32px;
  max-width:88%;width:380px;text-align:center;box-shadow:0 8px 48px rgba(0,0,0,.5);
}
.card h3{font-size:clamp(18px,4vw,24px);color:#2a1a0c;margin-bottom:10px}
.card p{font-size:clamp(14px,2.8vw,17px);color:#4d3420;line-height:1.7;margin-bottom:8px}
.rules{text-align:left;margin:12px 0;padding:14px 18px;background:rgba(42,26,12,.06);border-radius:10px}
.rules li{font-size:clamp(15px,3vw,19px);color:#2a1a0c;margin:7px 0;list-style:none;font-weight:600}
.rules li span{color:#8b6914;margin:0 6px}
.card button{
  margin-top:12px;padding:11px 44px;border:none;border-radius:8px;
  background:#4d3420;color:#fcf5e6;font-size:16px;font-weight:600;cursor:pointer;
}
.card button:active{opacity:.8}
.passCard h3{color:#2d6e2d}
</style>
</head>
<body>
<div id="app">
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <div id="bar">
    <div id="msg">在纸上写下那个名字</div>
    <div id="right">
      <span id="attempts">5</span>
      <div id="toolbar">
        <button id="clearBtn" class="b2">清除</button>
        <button id="submitBtn" class="b1">提交</button>
      </div>
    </div>
  </div>
</div>

<div id="hintOverlay" class="overlay">
  <div class="card">
    <h3>笔迹畸变规则</h3>
    <p>纸上墨迹会自行扭曲——</p>
    <ul class="rules">
      <li>横  ↔  竖</li>
      <li>撇  ↔  捺</li>
      <li>点、折  ➔  不变</li>
    </ul>
    <p style="font-size:14px;opacity:.65">试试写相反的笔画来抵消扭曲</p>
    <button id="hintOk">明白了</button>
  </div>
</div>

<div id="passOverlay" class="overlay">
  <div class="card passCard">
    <h3>字迹辨认成功</h3>
    <p>记忆的碎片拼合在一起——<br><strong style="font-size:120%">李丫丫</strong></p>
    <button id="passReset">再写一次</button>
  </div>
</div>

<script>
// ===================================================================
//  配置
// ===================================================================
const RULES = [
  '横(horizontal) ↔ 竖(vertical)',
  '撇(left-down) ↔ 捺(right-down)',
  '点(dot/short) → 保持',
  '折(fold/bend) → 保持',
];
const MAX_ATTEMPTS = 5;
const PASS_SCORE = 80; // 总分≥80即通过

// ===================================================================
//  状态
// ===================================================================
const S = {
  strokes: [],      // [{raw, deformed, type}] 已完成的笔画
  current: [],      // [{x,y}] 正在描的原始点
  drawing: false,
  ptrId: null,
  attempts: 0,
  passed: false,
  hintShown: false,
  texture: [],      // 纸纹预生成
};

// ===================================================================
//  DOM
// ===================================================================
const $ = id => document.getElementById(id);
const canvas = $('board');
const ctx = canvas.getContext('2d');
const msgEl = $('msg');
const attEl = $('attempts');

let W, H, dpr;

// ===================================================================
//  Canvas 尺寸
// ===================================================================
function resize() {
  dpr = window.devicePixelRatio || 1;
  const r = canvas.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  genTexture();
  render();
}
window.addEventListener('resize', resize);

// ===================================================================
//  纸纹
// ===================================================================
function genTexture() {
  S.texture = [];
  for (let i = 0; i < 120; i++)
    S.texture.push({x:Math.random()*W, y:Math.random()*H, r:0.3+Math.random()*2.8, a:0.015+Math.random()*0.04});
}

// ===================================================================
//  数学工具
// ===================================================================
const avg = arr => arr.reduce((s,v)=>v+s,0)/arr.length;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const mid = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
function bbox(pts) {
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const p of pts) { if(p.x<x0)x0=p.x; if(p.y<y0)y0=p.y; if(p.x>x1)x1=p.x; if(p.y>y1)y1=p.y; }
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}

// ===================================================================
//  笔画分类 (依据原始点)
// ===================================================================
function classifyStroke(pts) {
  if (pts.length < 3) return 'dot';
  const bb = bbox(pts);
  const diag = Math.hypot(bb.w, bb.h);
  if (diag < 18) return 'dot';                         // 小 → 点

  const dx = pts[pts.length-1].x - pts[0].x;
  const dy = pts[pts.length-1].y - pts[0].y;
  const len = Math.hypot(dx, dy);
  if (len < 12) return 'dot';

  // 检测是否有折（行程中方向明显变化）
  let dirChanges = 0;
  let prevDir = null;
  const step = Math.max(1, Math.floor(pts.length / 8));
  for (let i = step; i < pts.length - step; i += step) {
    const cd = {x: pts[i].x - pts[i-step].x, y: pts[i].y - pts[i-step].y};
    const nd = Math.hypot(cd.x, cd.y);
    if (nd < 4) continue;
    const deg = Math.atan2(cd.y, cd.x) * 57.3;
    if (prevDir !== null && Math.abs(deg - prevDir) > 40) dirChanges++;
    prevDir = deg;
  }
  if (dirChanges >= 2) return 'fold';                  // 折

  // 主方向角度 (起→终)
  let angle = Math.atan2(dy, dx) * 57.3;
  if (angle < 0) angle += 180;                         // 归一化到 0-180

  // 看伸展比: 哪个方向伸展更多
  const ratio = bb.w / (bb.h || 1);

  if (ratio > 2.2) return 'horizontal';                // 明显更宽 → 横
  if (ratio < 0.45) return 'vertical';                 // 明显更高 → 竖

  // 角度判断
  if (angle < 30 || angle > 150) return 'horizontal';  // 横
  if (angle > 65 && angle < 115) return 'vertical';    // 竖
  if (angle >= 30 && angle <= 65) return 'na';         // 捺 (↘)
  if (angle >= 115 && angle <= 150) return 'pie';      // 撇 (↙)
  return 'horizontal';
}

// ===================================================================
//  笔画变形
// ===================================================================
function deformStroke(pts, type) {
  if (pts.length < 2) return { deformed: pts, type };
  const cx = avg(pts.map(p=>p.x)), cy = avg(pts.map(p=>p.y));

  switch (type) {
    // 横↔竖: 绕中心旋转90°
    case 'horizontal':
    case 'vertical':
      return {
        type: type === 'horizontal' ? 'vertical' : 'horizontal',
        deformed: pts.map(p => ({
          x: cx + (p.y - cy),
          y: cy - (p.x - cx),
        })),
      };

    // 撇↔捺: 绕中心镜像 (沿垂直轴)
    case 'pie':  // 左撇 → 右捺
      return {
        type: 'na',
        deformed: pts.map(p => ({ x: cx - (p.x - cx), y: p.y })),
      };
    case 'na':   // 右捺 → 左撇
      return {
        type: 'pie',
        deformed: pts.map(p => ({ x: cx - (p.x - cx), y: p.y })),
      };

    // 点、折 → 不变
    default:
      return { deformed: [...pts], type };
  }
}

// ===================================================================
//  输入
// ===================================================================
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e => {
  if (S.passed) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  S.ptrId = e.pointerId; S.drawing = true;
  S.current = [getPos(e)];
});

canvas.addEventListener('pointermove', e => {
  if (!S.drawing || e.pointerId !== S.ptrId) return;
  e.preventDefault();
  const p = getPos(e);
  if (dist(p, S.current[S.current.length-1]) < 1.5) return;
  S.current.push(p);
  render();
});

canvas.addEventListener('pointerup', e => {
  if (!S.drawing || e.pointerId !== S.ptrId) return;
  e.preventDefault();
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
  S.drawing = false; S.ptrId = null;

  if (S.current.length >= 4) {
    const type = classifyStroke(S.current);
    const { deformed } = deformStroke(S.current, type);
    S.strokes.push({ raw: [...S.current], deformed, type });
  }
  S.current = [];
  render();
});

canvas.addEventListener('pointercancel', () => { S.drawing = false; S.ptrId = null; S.current = []; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ===================================================================
//  渲染
// ===================================================================
function render() {
  ctx.clearRect(0, 0, W, H);

  // --- 纸张底色 ---
  const g = ctx.createLinearGradient(0, 0, W*0.3, H*0.6);
  g.addColorStop(0, '#fcf5e6'); g.addColorStop(0.45, '#f7edd0');
  g.addColorStop(0.75, '#f2e2be'); g.addColorStop(1, '#ebd8ac');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // --- 纸纹 ---
  for (const d of S.texture) {
    ctx.fillStyle = `rgba(139,105,20,${d.a})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
  }

  // --- 陈年污渍 ---
  ctx.save();
  ctx.strokeStyle = 'rgba(90,60,30,.07)'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  for (let i=0;i<18;i++) {
    const t = S.texture[(i*7)%S.texture.length];
    const t2 = S.texture[(i*13)%S.texture.length];
    if (!t||!t2) continue;
    const sx = t.x*0.9+t2.x*0.1, sy = t.y*0.9+t2.y*0.1;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    for (let j=1;j<4;j++) {
      const t3 = S.texture[(i*5+j*11)%S.texture.length];
      ctx.lineTo(sx+(t3.x-t.x)*0.05, sy+(t3.y-t.y)*0.05);
    }
    ctx.stroke();
  }
  ctx.restore();

  // --- 三分区虚线 (极淡) ---
  ctx.save();
  ctx.strokeStyle = 'rgba(139,105,20,.06)'; ctx.setLineDash([4,12]); ctx.lineWidth = 1;
  for (let i=1;i<=2;i++) { const x=W*i/3; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  ctx.restore();

  // --- 已完成笔画的变形版 ---
  for (const s of S.strokes) drawInk(s.deformed, false);

  // --- 当前笔画的原始轨迹 (淡影) ---
  if (S.current.length >= 2) drawInk(S.current, true);
}

function drawInk(pts, ghost) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  if (pts.length === 2) {
    ctx.lineTo(pts[1].x, pts[1].y);
  } else {
    for (let i = 1; i < pts.length - 1; i++) {
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mid(pts[i], pts[i+1]).x, mid(pts[i], pts[i+1]).y);
    }
    ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
  }
  ctx.strokeStyle = ghost
    ? 'rgba(30,16,8,.18)'  // 当前笔迹淡影
    : '#1a0e06';           // 已变形墨迹
  ctx.lineWidth = ghost ? 2 : 2.6;
  ctx.stroke();
  ctx.restore();
}

// ===================================================================
//  匹配判定 (基于原始笔画数据)
// ===================================================================
function match() {
  const all = S.strokes.map(s => s.raw);
  if (all.length < 6) return false;

  // 按平均 X 分配到三个区域
  const zones = [[], [], []];
  for (const pts of all) {
    zones[Math.min(2, Math.max(0, Math.floor((avg(pts.map(p=>p.x)) / W) * 3)))].push(pts);
  }

  // 空区自动失败
  if (zones[0].length === 0 || zones[1].length === 0 || zones[2].length === 0) return false;

  let score = 0;

  // ---- 左区 (李) ----
  const z0 = zones[0];
  let z0h=false, z0v=false;
  for (const pts of z0) {
    const t = classifyStroke(pts);
    if (t === 'horizontal') z0h = true;
    if (t === 'vertical') z0v = true;
  }
  score += Math.min(25, z0.length * 4);
  if (z0h && z0v) score += 25;

  // ---- 中区 (丫): 必须有竖笔，否则最多给3分占位 ----
  const z1 = zones[1];
  let z1v=false;
  for (const pts of z1) { if (classifyStroke(pts) === 'vertical') z1v = true; }
  if (z1v) { score += Math.min(25, z1.length * 8); } else { score += Math.min(3, z1.length * 1); }

  // ---- 右区 (丫): 同上 ----
  const z2 = zones[2];
  let z2v=false;
  for (const pts of z2) { if (classifyStroke(pts) === 'vertical') z2v = true; }
  if (z2v) { score += Math.min(25, z2.length * 8); } else { score += Math.min(3, z2.length * 1); }

  // ---- 总量加分 ----
  score += Math.min(10, Math.max(0, all.length - 6) * 2);

  return score >= PASS_SCORE;
}

// ===================================================================
//  UI 操作
// ===================================================================
function clr() { S.strokes=[]; S.current=[]; render(); setMsg(''); }
function setMsg(text,err){ msgEl.textContent=text; msgEl.style.color=err?'#e8a078':'#d4b896'; }
function updAtt(){ attEl.textContent=Math.max(0,MAX_ATTEMPTS-S.attempts); }

$('clearBtn').addEventListener('click', clr);

$('submitBtn').addEventListener('click', () => {
  if (S.passed) return;
  if (S.strokes.length < 3) { setMsg('先在纸上写点什么', true); return; }
  if (match()) {
    S.passed = true;
    $('passOverlay').classList.add('active');
    setMsg('✓ 辨认成功——"李丫丫"');
    return;
  }
  S.attempts++;
  updAtt();
  if (S.attempts >= MAX_ATTEMPTS && !S.hintShown) { S.hintShown = true; $('hintOverlay').classList.add('active'); }
  else if (S.attempts >= MAX_ATTEMPTS) setMsg('还是不对，想想畸变规则', true);
  else setMsg(`不太像，再试试 (${S.attempts}/${MAX_ATTEMPTS})`, true);
});

$('hintOk').addEventListener('click', () => {
  $('hintOverlay').classList.remove('active');
  setMsg('横↔竖、撇↔捺，试试反着写', true);
});

$('passReset').addEventListener('click', () => {
  $('passOverlay').classList.remove('active');
  clr();
  S.attempts=0; S.passed=false; S.hintShown=false; updAtt();
});

// ===================================================================
//  启动
// ===================================================================
resize();
updAtt();
</script>
</body>
</html>
