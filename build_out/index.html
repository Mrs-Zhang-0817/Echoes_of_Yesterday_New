function vibe(ms) {
  try { navigator.vibrate(ms); } catch (e) { /* 不支持振动 */ }
}

class Chapter06 {
  constructor(game) {
    this.game = game;
    this.phase = 'narrative';
    this.phaseTime = 0;
    this._complete = false;
    this.time = 0;

    // Gating 1 — 触觉感知
    this.comfortProgress = 0;
    this.fingerInBowl = false;

    // 蒸汽粒子
    this.steam = this._initSteam();

    // Gating 2 — 气味拼图
    this.particles = this._initParticles();
    this.collectedCount = 0;
    this.fingerX = -1;
    this.fingerY = -1;
    this.transformProgress = 0;  // 收集完成后几何体变形动画
    this.transformDone = false;
    // 收集完成时的目标光晕
    this.targetGlow = [0, 0, 0];

    // 叙事文本 — 用多行分段
    this.narrativeLines = [
      '终于进了家门。',
      '"爸，折腾一天饿了吧，快吃。"',
      '桌上是一碗热气腾腾的面条。',
      '可是……这白乎乎的东西是什么怪物？',
    ];
  }

  get isComplete() { return this._complete; }

  _initSteam() {
    const s = [];
    for (let i = 0; i < GATING_CONFIG.steamCount; i++) {
      s.push({
        x: BOWL.cx + (Math.random() - 0.5) * 100,
        y: BOWL.cy - 50 + (Math.random() - 0.5) * 30,
        speed: 20 + Math.random() * 30,
        drift: (Math.random() - 0.5) * 30,
        life: Math.random(),
        phase: Math.random() * Math.PI * 2,
      });
    }
    return s;
  }

  _initParticles() {
    const list = [];
    for (const scent of SCENT_PARTICLES) {
      for (let i = 0; i < scent.count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 60;
        list.push({
          scentId: scent.id,
          x: scent.sourceX + Math.cos(angle) * dist,
          y: scent.sourceY + Math.sin(angle) * dist,
          vx: 0, vy: 0,
          locked: false,
          collected: false,
          size: 3 + Math.random() * 4,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }
    return list;
  }

  onEnter() {
    this.game.input.setHandlers({
      down: point => this.handleDown(point),
      move: point => this.handleMove(point),
      up: point => this.handleUp(point),
      cancel: () => this.handleCancel(),
    });
  }

  onExit() {
    this.game.input.setHandlers();
  }

  // ============ 输入处理 ============

  handleDown(point) {
    try {
      if (this.phase === 'narrative') {
        if (this.phaseTime > 1.5) { this.phase = 'gating1'; this.phaseTime = 0; }
      } else if (this.phase === 'gating1') {
        if (hitBowl(point.x, point.y)) {
          this.fingerInBowl = true;
        }
      }
      // Gating 2 不依赖 down
    } catch (e) { console.error('Ch06 handleDown:', e); }
  }

  handleMove(point) {
    try {
      this.fingerX = point.x;
      this.fingerY = point.y;

      if (this.phase === 'gating1') {
        if (this.fingerInBowl) {
          if (!hitBowl(point.x, point.y)) {
            this.fingerInBowl = false;
          }
        } else if (hitBowl(point.x, point.y)) {
          this.fingerInBowl = true;
        }
      }
    } catch (e) { console.error('Ch06 handleMove:', e); }
  }

  handleUp(_point) {
    if (this.phase === 'gating1') {
      this.fingerInBowl = false;
    }
  }

  handleCancel() {
    this.fingerInBowl = false;
  }

  // ============ update ============

  update(dt) {
    this.time += dt;
    this.phaseTime += dt;

    switch (this.phase) {
      case 'narrative':
        if (this.phaseTime >= 4) { this.phase = 'gating1'; this.phaseTime = 0; }
        break;

      case 'gating1':
        this._updateGating1(dt);
        break;

      case 'gating1_done':
        if (this.phaseTime >= 1.5) {
          this.phase = 'gating2';
          this.phaseTime = 0;
        }
        break;

      case 'gating2':
        this._updateGating2(dt);
        break;

      case 'gating2_celebrate':
        this.transformProgress = Math.min(1, this.phaseTime / 1.5);
        if (this.phaseTime >= 2 && !this._complete) {
          this._complete = true;
          this.phase = 'complete';
          this.phaseTime = 0;
        }
        break;

      case 'complete':
        if (this.phaseTime >= 1) {
          this.game.progress.save('ch06_complete', true);
          this.game.overlay.show({
            type: 'complete',
            title: '一碗热面，唤醒沉睡的味觉',
            message: '记忆解锁 45%',
            buttons: [
              { text: '继续下一章节', action: () => this.game.chapterManager.next() },
            ],
          });
        }
        break;
    }
  }

  _updateGating1(dt) {
    // 蒸汽动画
    for (const s of this.steam) {
      s.life += dt * 0.4;
      if (s.life > 1) { s.life = 0; s.x = BOWL.cx + (Math.random() - 0.5) * 100; s.y = BOWL.cy - 50; }
      s.y -= s.speed * dt;
      s.x += Math.sin(s.life * Math.PI * 2 + s.phase) * s.drift * dt;
    }

    if (this.fingerInBowl && this.comfortProgress < 1) {
      this.comfortProgress = Math.min(1, this.comfortProgress + dt / GATING_CONFIG.comfortTime);
      if (this.comfortProgress >= 1) {
        vibe(20);
        this.phase = 'gating1_done';
        this.phaseTime = 0;
      }
    } else if (!this.fingerInBowl && this.comfortProgress > 0) {
      this.comfortProgress = Math.max(0, this.comfortProgress - GATING_CONFIG.comfortDecay * dt);
    }
  }

  _updateGating2(dt) {
    // 更新粒子
    for (const p of this.particles) {
      if (p.locked) continue;

      const scent = SCENT_PARTICLES.find(s => s.id === p.scentId);
      if (!scent || scent.collected) continue;

      // 布朗运动
      p.phase += dt * 2;
      p.x += Math.sin(p.phase) * 0.5;
      p.y += Math.cos(p.phase * 0.7) * 0.5;

      // 吸附逻辑：手指靠近
      if (this.fingerX >= 0) {
        const dist = Math.hypot(p.x - this.fingerX, p.y - this.fingerY);
        if (dist < GATING_CONFIG.magnetRadius) {
          const strength = 1 - dist / GATING_CONFIG.magnetRadius;
          const angle = Math.atan2(this.fingerY - p.y, this.fingerX - p.x);
          p.x += Math.cos(angle) * GATING_CONFIG.particleSpeed * strength * dt;
          p.y += Math.sin(angle) * GATING_CONFIG.particleSpeed * strength * dt;
        }
      }

      // 检测是否进入目标区域
      const d = distToTarget(p.x, p.y, scent);
      if (d < GATING_CONFIG.targetRadius) {
        p.locked = true;
        p.collected = true;
        vibe(8);
      }
    }

    // 检查每种香气是否已收集足够粒子
    for (const scent of SCENT_PARTICLES) {
      if (scent.collected) continue;
      const locked = this.particles.filter(p => p.scentId === scent.id && p.locked).length;
      if (locked >= scent.count * 0.7) {
        scent.collected = true;
        this.collectedCount++;
        vibe(15);
      }
    }

    // 目标发光动画
    for (let i = 0; i < 3; i++) {
      const scent = SCENT_PARTICLES[i];
      this.targetGlow[i] += (scent.collected ? 1 - this.targetGlow[i] : 0 - this.targetGlow[i]) * Math.min(1, dt * 4);
    }

    // 全部收集完成
    if (this.collectedCount >= 3 && !this.transformDone) {
      this.transformDone = true;
      this.phase = 'gating2_celebrate';
      this.phaseTime = 0;
    }
  }

  // ============ render ============

  render(ctx) {
    try {
      this._renderSafe(ctx);
    } catch (e) {
      console.error('Ch06 render error:', e);
      ctx.fillStyle = '#0a0806';
      ctx.fillRect(0, 0, this.game.width, this.game.height);
      ctx.fillStyle = '#d4b896';
      ctx.font = '20px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('画面加载异常，请重试', this.game.width / 2, this.game.height / 2);
    }
  }

  _renderSafe(ctx) {
    const { width, height } = this.game;
    switch (this.phase) {
      case 'narrative': this.renderNarrative(ctx); break;
      case 'gating1':
      case 'gating1_done': this.renderGating1(ctx); break;
      case 'gating2': this.renderGating2(ctx); break;
      case 'gating2_celebrate': this.renderGating2Celebrate(ctx); break;
      case 'complete': /* overlay 处理 */ break;
      default:
        ctx.fillStyle = '#0a0806';
        ctx.fillRect(0, 0, width, height);
    }
  }

  // ---------- 叙事开场 ----------

  renderNarrative(ctx) {
    const { width, height } = this.game;
    ctx.fillStyle = '#0a0806';
    ctx.fillRect(0, 0, width, height);

    const alpha = Math.min(1, this.phaseTime / 1.5);
    const textIdx = Math.min(Math.floor(this.phaseTime / 0.9), this.narrativeLines.length - 1);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#d4b896';
    ctx.font = '500 26px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const chars = Math.floor((this.phaseTime - textIdx * 0.9) / 0.035);
    ctx.fillText(this.narrativeLines[textIdx].slice(0, Math.min(chars, this.narrativeLines[textIdx].length)), width / 2, height / 2 - 20);

    if (this.phaseTime > 2.5) {
      ctx.globalAlpha = Math.min(1, (this.phaseTime - 2.5) / 0.8);
      ctx.fillStyle = '#8a7a6a';
      ctx.font = '16px system-ui, "PingFang SC", sans-serif';
      ctx.fillText('点击或触摸继续……', width / 2, height - 60);
    }
    ctx.restore();
  }

  // ---------- Gating 1：触觉与热量感知 ----------

  renderGating1(ctx) {
    const { width, height } = this.game;

    // 1. 餐桌背景
    this._drawTableBg(ctx, width, height);

    // 2. 蒸汽
    this._drawSteam(ctx);

    // 3. 焦虑光晕 + 进度过渡
    this._drawAnxietyVignette(ctx, width, height);

    // 4. 碗 + 荷包蛋怪物
    this._drawBowl(ctx);

    // 5. 温度光晕
    this._drawWarmGlow(ctx);

    // 6. 进度环
    this._drawComfortRing(ctx);

    // 7. 提示文字
    if (this.phase === 'gating1') {
      if (this.fingerInBowl) {
        drawPrompt(ctx, '它是温热的，没有危险……', width / 2, height - 40, 0.2);
      } else if (this.comfortProgress > 0) {
        drawPrompt(ctx, '继续抚摸碗壁……', width / 2, height - 40, 0);
      } else {
        drawPrompt(ctx, '它冒着热气……试着摸摸碗壁', width / 2, height - 40, 0);
      }
    } else if (this.phase === 'gating1_done') {
      const a = Math.min(1, this.phaseTime / 0.8);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#f0c040';
      ctx.font = 'bold 22px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('感觉安全了一些……', width / 2, height - 45);
      ctx.restore();
    }
  }

  _drawTableBg(ctx, width, height) {
    // 优先使用真实餐桌场景底图，加载失败回退程序化渐变
    const bgImg = this.game.images.deskBg;
    if (bgImg) {
      drawImageCover(ctx, bgImg, width, height);
      // 暖色遮罩保持文字和互动元素可读性
      ctx.fillStyle = 'rgba(30, 20, 15, 0.35)';
      ctx.fillRect(0, 0, width, height);
    } else {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#2a2018');
      grad.addColorStop(0.5, '#3a2e20');
      grad.addColorStop(1, '#1e1812');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
    }

    // 桌面（叠在背景上）
    ctx.fillStyle = 'rgba(74, 58, 40, 0.6)';
    ctx.beginPath();
    ctx.ellipse(width / 2, height - 60, 500, 120, 0, Math.PI, 0);
    ctx.fill();

    // 桌面高光
    ctx.fillStyle = 'rgba(255, 240, 200, 0.06)';
    ctx.beginPath();
    ctx.ellipse(width / 2, height - 90, 350, 50, 0, Math.PI, 0);
    ctx.fill();
  }

  _drawSteam(ctx) {
    ctx.save();
    for (const s of this.steam) {
      const alpha = Math.sin(s.life * Math.PI) * 0.2;
      ctx.fillStyle = `rgba(240, 230, 210, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 4 + Math.sin(s.life * Math.PI * 3) * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  _drawAnxietyVignette(ctx, width, height) {
    const p = this.comfortProgress;
    // 红色 → 暖橘色渐变
    const r = Math.round(180 * (1 - p));
    const g = Math.round(50 + 80 * p);
    const b = Math.round(40 + 60 * p);
    const alpha = 0.3 * (1 - p * 0.7);
    const grad = ctx.createRadialGradient(width / 2, height / 2, 200, width / 2, height / 2, 450);
    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0)`);
    grad.addColorStop(0.6, `rgba(${r}, ${g}, ${b}, ${alpha * 0.5})`);
    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, ${alpha})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // 边缘闪烁线条（焦虑特效）
    if (p < 0.8) {
      const flicker = (1 - p) * 0.15 * (0.5 + 0.5 * Math.sin(this.time * 6));
      ctx.save();
      ctx.strokeStyle = `rgba(180, 40, 30, ${flicker})`;
      ctx.lineWidth = 2;
      // 上下边缘不规则线条
      for (let i = 0; i < 8; i++) {
        const lx = Math.random() * width;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx + 20, Math.random() * 30);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(lx, height);
        ctx.lineTo(lx + 20, height - Math.random() * 30);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  _drawBowl(ctx) {
    const cx = BOWL.cx, cy = BOWL.cy;

    ctx.save();

    // 碗的外沿
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#d4c8b0';
    ctx.beginPath();
    ctx.ellipse(cx, cy, BOWL.rx, BOWL.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // 碗内壁（深色）
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#b8a88a';
    ctx.beginPath();
    ctx.ellipse(cx, cy - 8, BOWL.innerRx, BOWL.innerRy, 0, 0, Math.PI * 2);
    ctx.fill();

    // 碗内汤底
    ctx.fillStyle = '#8a6a3a';
    ctx.beginPath();
    ctx.ellipse(cx, cy - 4, BOWL.innerRx - 10, BOWL.innerRy - 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // 面条（曲线）
    ctx.strokeStyle = '#c8b88a';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const baseAngle = i * Math.PI / 2 + this.time * 0.5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(baseAngle) * 40, cy - 10 + Math.sin(baseAngle) * 20);
      ctx.quadraticCurveTo(cx + Math.cos(baseAngle + 0.5) * 70, cy - 30, cx + Math.cos(baseAngle + 1) * 40, cy - 15);
      ctx.stroke();
    }

    // 荷包蛋 — 在主角眼中是"怪物"形状
    if (this.phase === 'gating1' || this.phase === 'gating1_done') {
      // 蛋白 = 白色扭曲椭圆（像怪物的眼白）
      ctx.fillStyle = '#f0ece0';
      ctx.beginPath();
      ctx.ellipse(cx + 10, cy - 25, 50, 30, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // 蛋黄 = 黄色圆形（像瞳孔）
      ctx.fillStyle = '#f0a030';
      ctx.beginPath();
      ctx.arc(cx + 5, cy - 28, 12, 0, Math.PI * 2);
      ctx.fill();

      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(cx, cy - 33, 4, 0, Math.PI * 2);
      ctx.fill();

      // 怪物化细节：三叉触须
      ctx.strokeStyle = 'rgba(200,100,80,0.3)';
      ctx.lineWidth = 3;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + i * 20, cy - 12);
        ctx.lineTo(cx + i * 30, cy + 5);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  _drawWarmGlow(ctx) {
    if (this.comfortProgress <= 0) return;
    const alpha = this.comfortProgress * 0.2;
    const grad = ctx.createRadialGradient(BOWL.cx, BOWL.cy, 20, BOWL.cx, BOWL.cy, BOWL.rx + 60);
    grad.addColorStop(0, `rgba(255, 200, 100, ${alpha})`);
    grad.addColorStop(1, 'rgba(255, 200, 100, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(BOWL.cx, BOWL.cy, BOWL.rx + 60, 0, Math.PI * 2);
    ctx.fill();
  }

  _drawComfortRing(ctx) {
    if (this.comfortProgress <= 0) return;
    const cx = BOWL.cx, cy = BOWL.cy - BOWL.ry - 30;
    const ringR = 22;

    ctx.save();

    // 背景环
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    ctx.stroke();

    // 进度环
    ctx.strokeStyle = '#f0c040';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * this.comfortProgress);
    ctx.stroke();

    // 百分比
    ctx.fillStyle = '#f0c040';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.7;
    ctx.fillText(`${Math.round(this.comfortProgress * 100)}%`, cx, cy);

    ctx.restore();
  }

  // ---------- Gating 2：气味拼图 ----------

  renderGating2(ctx) {
    const { width, height } = this.game;

    // 1. 背景（保持餐桌）
    this._drawTableBg(ctx, width, height);

    // 2. 抽象化食物（几何体）
    this._drawAbstractFood(ctx);

    // 3. 目标残影区域
    this._drawTargetZones(ctx);

    // 4. 香气粒子
    this._drawParticles(ctx);

    // 5. 手指拖拽光晕
    this._drawFingerGlow(ctx);

    // 6. 收集进度面板
    this._drawCollectionPanel(ctx);

    // 7. 提示文字
    drawPrompt(ctx, '用手指将香气引导到食物上', width / 2, height - 35, 0);
  }

  _drawAbstractFood(ctx) {
    const cx = BOWL.cx, cy = BOWL.cy - 15;

    ctx.save();

    // 面条 = 混乱纠缠的灰色曲线
    ctx.strokeStyle = '#6a6a6a';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const t = this.time * 0.8 + i * 1.2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.sin(t) * 30, cy + Math.cos(t * 0.7) * 20);
      ctx.quadraticCurveTo(
        cx + Math.sin(t + 1) * 60, cy + Math.cos(t * 0.5 + 1) * 40,
        cx + Math.sin(t + 2) * 40, cy + Math.cos(t * 0.8 + 2) * 25,
      );
      ctx.stroke();
    }

    // 荷包蛋怪物 = 扭曲的白色几何体 + 黄色圆形
    ctx.fillStyle = '#a0a0a0';
    ctx.beginPath();
    ctx.ellipse(cx + 15, cy - 15, 45, 28, 0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.arc(cx + 8, cy - 18, 10, 0, Math.PI * 2);
    ctx.fill();

    // 诡异线条
    ctx.strokeStyle = 'rgba(100,80,80,0.4)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const a = this.time * 1.5 + i * 1.3;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 45, cy - 15 + Math.sin(a) * 25);
      ctx.lineTo(cx + Math.cos(a + 0.5) * 55, cy - 15 + Math.sin(a + 0.5) * 35);
      ctx.stroke();
    }

    ctx.restore();
  }

  _drawTargetZones(ctx) {
    for (let i = 0; i < SCENT_PARTICLES.length; i++) {
      const scent = SCENT_PARTICLES[i];
      const glow = this.targetGlow[i];

      ctx.save();

      // 外圈发光
      const grad = ctx.createRadialGradient(scent.targetX, scent.targetY, 5, scent.targetX, scent.targetY, GATING_CONFIG.targetRadius + 10);
      grad.addColorStop(0, scent.glowColor);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(scent.targetX, scent.targetY, GATING_CONFIG.targetRadius + 10, 0, Math.PI * 2);
      ctx.fill();

      // 虚线圆
      ctx.strokeStyle = scent.collected ? scent.color : `rgba(200,200,200,0.3)`;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.arc(scent.targetX, scent.targetY, GATING_CONFIG.targetRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 标签
      if (!scent.collected) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '14px system-ui, "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(scent.label, scent.targetX, scent.targetY - GATING_CONFIG.targetRadius - 8);
      } else {
        // 勾号
        ctx.fillStyle = scent.color;
        ctx.font = '20px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = 0.5 + 0.3 * Math.sin(this.time * 2);
        ctx.fillText('✓', scent.targetX, scent.targetY);
      }

      ctx.restore();
    }
  }

  _drawParticles(ctx) {
    for (let i = 0; i < SCENT_PARTICLES.length; i++) {
      const scent = SCENT_PARTICLES[i];
      if (scent.collected) continue;

      const particles = this.particles.filter(p => p.scentId === scent.id && !p.collected);
      for (const p of particles) {
        ctx.save();

        // 发光
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
        grad.addColorStop(0, scent.color + '60');
        grad.addColorStop(1, scent.color + '00');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
        ctx.fill();

        // 粒子本身
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(this.time * 2 + p.phase);
        ctx.fillStyle = scent.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }
  }

  _drawFingerGlow(ctx) {
    if (this.fingerX < 0 || this.fingerY < 0) return;

    ctx.save();
    const grad = ctx.createRadialGradient(this.fingerX, this.fingerY, 0, this.fingerX, this.fingerY, GATING_CONFIG.magnetRadius);
    grad.addColorStop(0, 'rgba(255,255,255,0.08)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.fingerX, this.fingerY, GATING_CONFIG.magnetRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  _drawCollectionPanel(ctx) {
    const cfg = COLLECTION_PANEL;

    ctx.save();

    // 面板背景
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundedRect(ctx, cfg.x - 8, cfg.y - 8, 180, 44, 10);
    ctx.fill();

    for (let i = 0; i < SCENT_PARTICLES.length; i++) {
      const scent = SCENT_PARTICLES[i];
      const bx = cfg.x + i * (cfg.iconSize + cfg.gap);
      const by = cfg.y;

      // 圆圈
      ctx.fillStyle = scent.collected ? scent.color : 'rgba(100,100,100,0.5)';
      ctx.globalAlpha = scent.collected ? 0.9 : 0.4;
      ctx.beginPath();
      ctx.arc(bx + cfg.iconSize / 2, by + cfg.iconSize / 2, cfg.iconSize / 2, 0, Math.PI * 2);
      ctx.fill();

      // 收集后的勾
      if (scent.collected) {
        ctx.fillStyle = '#fff';
        ctx.font = '14px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✓', bx + cfg.iconSize / 2, by + cfg.iconSize / 2 + 1);
      }
    }

    ctx.restore();
  }

  // ---------- Gating 2：庆祝过渡动画 ----------

  renderGating2Celebrate(ctx) {
    const { width, height } = this.game;

    this._drawTableBg(ctx, width, height);

    // 食物从抽象恢复真实的过渡
    const tp = this.transformProgress;
    this._drawTransformingFood(ctx, tp);

    // 目标区域光晕
    for (let i = 0; i < SCENT_PARTICLES.length; i++) {
      const scent = SCENT_PARTICLES[i];
      ctx.save();
      const g = ctx.createRadialGradient(scent.targetX, scent.targetY, 5, scent.targetX, scent.targetY, 40 + tp * 30);
      g.addColorStop(0, scent.color + '80');
      g.addColorStop(1, scent.color + '00');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(scent.targetX, scent.targetY, 40 + tp * 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 蒸汽增多
    ctx.save();
    for (let i = 0; i < 20; i++) {
      const t = this.time * 3 + i * 2.1;
      const sx = BOWL.cx + Math.sin(t) * 60;
      const sy = BOWL.cy - 40 - (t % 60);
      const alpha = Math.sin(t * 0.5) * 0.15;
      ctx.fillStyle = `rgba(240, 230, 210, ${alpha})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 5 + Math.sin(t) * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 金色粒子
    ctx.save();
    for (let i = 0; i < 12; i++) {
      const t = this.phaseTime * 8 + i * 2.5;
      const px = width / 2 + Math.cos(t) * (80 + Math.sin(t * 0.7) * 40);
      const py = height / 2 + Math.sin(t * 0.8) * 60;
      ctx.fillStyle = `rgba(240, 192, 64, ${0.3 + 0.2 * Math.sin(t)})`;
      ctx.beginPath();
      ctx.arc(px, py, 2 + Math.sin(t * 2) * 1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 文字
    ctx.save();
    ctx.fillStyle = '#f0c040';
    ctx.font = 'bold 28px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = Math.min(1, tp);
    ctx.fillText('这味道……好熟悉。', width / 2, height / 2 - 30);

    ctx.fillStyle = '#d4b896';
    ctx.font = '18px system-ui, "PingFang SC", sans-serif';
    ctx.globalAlpha = Math.min(1, tp);
    ctx.fillText('是记忆中的味道。', width / 2, height / 2 + 20);

    ctx.restore();
  }

  _drawTransformingFood(ctx, tp) {
    const cx = BOWL.cx, cy = BOWL.cy - 15;

    ctx.save();

    // 面条：从灰色纠缠 → 暖色自然曲线
    const lineColor = tp < 0.5 ? '#6a6a6a' : '#c8b88a';
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 4 + (1 - tp) * 2;
    ctx.lineCap = 'round';

    const chaos = 1 - tp;  // 混乱度递减
    for (let i = 0; i < 5; i++) {
      const t = this.time * 0.5 + i * 1.5;
      ctx.beginPath();
      ctx.moveTo(
        cx + Math.sin(t) * 30 * chaos,
        cy + Math.cos(t * 0.7) * 20 * chaos,
      );
      ctx.quadraticCurveTo(
        cx + Math.sin(t + 1) * (40 + tp * 30) * chaos,
        cy + Math.cos(t * 0.5 + 1) * (20 + tp * 15) * chaos,
        cx + Math.sin(t + 2) * (25 + tp * 20),
        cy + Math.cos(t * 0.8 + 2) * (15 + tp * 10),
      );
      ctx.stroke();
    }

    // 荷包蛋：从灰色怪物 → 正常白色蛋白+金黄蛋黄
    const eggGray = Math.round(160 * (1 - tp));
    ctx.fillStyle = `rgb(${240 - eggGray}, ${236 - eggGray * 0.5}, ${224 - eggGray * 0.3})`;
    ctx.beginPath();
    ctx.ellipse(cx + 15 - tp * 5, cy - 15 + tp * 5, 45 - chaos * 10, 28 - chaos * 8, 0.3 * chaos, 0, Math.PI * 2);
    ctx.fill();

    const yolkR = Math.round(240 * tp + 160 * (1 - tp));
    const yolkG = Math.round(160 * tp + 80 * (1 - tp));
    const yolkB = Math.round(48 * tp + 60 * (1 - tp));
    ctx.fillStyle = `rgb(${yolkR}, ${yolkG}, ${yolkB})`;
    ctx.beginPath();
    ctx.arc(cx + 8 - tp * 3, cy - 18 + tp * 3, 10 + tp * 2, 0, Math.PI * 2);
    ctx.fill();

    // 高光恢复
    if (tp > 0.3) {
      ctx.fillStyle = `rgba(255,255,255,${(tp - 0.3) * 0.6})`;
      ctx.beginPath();
      ctx.arc(cx + 5 - tp * 2, cy - 23 + tp * 3, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}


// ---- src/chapters/ch07_night.js ----
// Ch7 惊悚夜醒——在黑暗中摸到门锁



function vibe(ms) {
  try { navigator.vibrate(ms); } catch (e) { /* 不支持振动 */ }
}

class Chapter07 {
  constructor(game) {
    this.game = game;
    this.phase = 'narrative';
    this.phaseTime = 0;
    this._complete = false;
    this.time = 0;

    // 门锁位置
    this.lockX = 640;
    this.lockY = 500;

    // 手指跟踪
    this.fingerX = -1;
    this.fingerY = -1;
    this.fingerActive = false;

    // 静态噪点（极暗的灰点）
    this.noiseDots = [];
    for (let i = 0; i < 80; i++) {
      this.noiseDots.push({
        x: Math.random() * 1280,
        y: Math.random() * 720,
        opacity: 0.01 + Math.random() * 0.03,
      });
    }

    // 超时兜底
    this.warmLightProgress = 0; // 0~1，50s 开始增长，60s 达到 1
    this.timeoutRevealed = false;
    this.moonHintShown = false;

    // 叙事文本
    this.narrativeLines = [
      '深夜，不知是几点。',
      '黑暗中，只有自己的呼吸声。',
      '什么都看不见……只能用手去摸索。',
      '需要找到那个熟悉的东西……',
    ];

    // 完成动画参数
    this.openProgress = 0;
    this.completeTransition = false;
  }

  get isComplete() { return this._complete; }
  get completeTitle() { return '找到门锁'; }
  get completeMessage() { return '终于找到了门……'; }

  // ============ 生命周期 ============

  onEnter() {
    this.game.input.setHandlers({
      down: point => this.handleDown(point),
      move: point => this.handleMove(point),
      up: () => this.handleUp(),
      cancel: () => this.handleCancel(),
    });
  }

  onExit() {
    this.game.input.setHandlers();
  }

  // ============ 输入处理 ============

  handleDown(point) {
    try {
      if (this.phase === 'narrative') {
        if (this.phaseTime > 1.0) {
          this.phase = 'searching';
          this.phaseTime = 0;
          this.fingerX = point.x;
          this.fingerY = point.y;
          this.fingerActive = true;
        }
        return;
      }

      if (this.phase === 'searching') {
        this.fingerX = point.x;
        this.fingerY = point.y;
        this.fingerActive = true;

        // 超时后任意点击即开门
        if (this.timeoutRevealed) {
          this._openDoor();
          return;
        }

        // 手指非常接近门锁时点击 → 开门
        const dist = Math.hypot(point.x - this.lockX, point.y - this.lockY);
        if (dist < 35) {
          this._openDoor();
          vibe(50);
        }
        return;
      }
    } catch (e) { console.error('Ch07 handleDown:', e); }
  }

  handleMove(point) {
    if (this.phase === 'searching') {
      this.fingerX = point.x;
      this.fingerY = point.y;
    }
  }

  handleUp() {
    this.fingerActive = false;
  }

  handleCancel() {
    this.fingerActive = false;
  }

  _openDoor() {
    this.phase = 'found';
    this.phaseTime = 0;
    vibe(100);
  }

  // ============ 辅助方法 ============

  /** 手指到门锁的距离 */
  _getFingerDist() {
    if (this.fingerX < 0 || this.fingerY < 0) return Infinity;
    return Math.hypot(this.fingerX - this.lockX, this.fingerY - this.lockY);
  }

  /** 门锁呼吸透明度（0.04~0.08），周期 3.5s */
  _getBreathOpacity() {
    const breath = Math.sin(this.time * Math.PI * 2 / 3.5);
    return 0.04 + (breath * 0.5 + 0.5) * 0.04;
  }

  // ============ update ============

  update(dt) {
    this.time += dt;
    this.phaseTime += dt;

    switch (this.phase) {
      case 'narrative':
        if (this.phaseTime >= 5) {
          this.phase = 'searching';
          this.phaseTime = 0;
        }
        break;

      case 'searching':
        // 60s 超时兜底机制
        if (this.phaseTime > 50) {
          this.warmLightProgress = Math.min(1, (this.phaseTime - 50) / 10);
          if (this.phaseTime > 58 && !this.moonHintShown) {
            this.moonHintShown = true;
          }
          if (this.phaseTime > 60 && !this.timeoutRevealed) {
            this.timeoutRevealed = true;
            vibe(30);
          }
        }
        break;

      case 'found':
        this.openProgress = Math.min(1, this.phaseTime / 1.0);
        if (this.phaseTime >= 1.0 && !this._complete) {
          this._complete = true;
          this.phase = 'complete';
          this.phaseTime = 0;
        }
        break;

      case 'complete':
        // 由 ChapterManager 检测 isComplete 统一弹 Overlay
        break;
    }
  }

  // ============ render ============

  render(ctx) {
    try {
      this._renderSafe(ctx);
    } catch (e) {
      console.error('Ch07 render error:', e);
      ctx.fillStyle = '#0a0806';
      ctx.fillRect(0, 0, this.game.width, this.game.height);
      ctx.fillStyle = '#d4b896';
      ctx.font = '20px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('画面加载异常，请重试', this.game.width / 2, this.game.height / 2);
    }
  }

  _renderSafe(ctx) {
    const { width, height } = this.game;

    switch (this.phase) {
      case 'narrative':
        this.renderNarrative(ctx);
        break;
      case 'searching':
        this.renderSearching(ctx);
        break;
      case 'found':
        this.renderFound(ctx);
        break;
      case 'complete':
        /* overlay 处理 */
        break;
      default:
        ctx.fillStyle = '#0a0806';
        ctx.fillRect(0, 0, width, height);
    }
  }

  // ---------- 叙事开场 ----------

  renderNarrative(ctx) {
    const { width, height } = this.game;
    ctx.fillStyle = '#0a0806';
    ctx.fillRect(0, 0, width, height);

    const alpha = Math.min(1, this.phaseTime / 1.5);
    const textIdx = Math.min(Math.floor(this.phaseTime / 1.0), this.narrativeLines.length - 1);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#d4b896';
    ctx.font = '500 26px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const chars = Math.floor((this.phaseTime - textIdx * 1.0) / 0.035);
    ctx.fillText(this.narrativeLines[textIdx].slice(0, Math.min(chars, this.narrativeLines[textIdx].length)), width / 2, height / 2 - 20);

    if (this.phaseTime > 2.8) {
      ctx.globalAlpha = Math.min(1, (this.phaseTime - 2.8) / 0.8);
      ctx.fillStyle = '#8a7a6a';
      ctx.font = '16px system-ui, "PingFang SC", sans-serif';
      ctx.fillText('点击或触摸继续……', width / 2, height - 60);
    }
    ctx.restore();
  }

  // ---------- 搜索阶段 ----------

  renderSearching(ctx) {
    const { width, height } = this.game;

    // 1. 纯黑背景
    ctx.fillStyle = '#0a0806';
    ctx.fillRect(0, 0, width, height);

    // 2. 噪点
    this._drawNoise(ctx);

    // 3. 门锁（根据手指距离与超时状态决定透明度和光晕）
    this._drawLock(ctx);

    // 4. 手指光圈（微弱暖光照亮手指周围）
    if (this.fingerActive) {
      this._drawFingerLight(ctx);
    }

    // 5. 超时暖光（月光）
    if (this.warmLightProgress > 0) {
      this._drawWarmLight(ctx);
    }

    // 6. UI 提示
    this._drawSearchUI(ctx);
  }

  _drawNoise(ctx) {
    ctx.save();
    for (const dot of this.noiseDots) {
      ctx.fillStyle = `rgba(160, 150, 140, ${dot.opacity})`;
      ctx.fillRect(dot.x, dot.y, 1.5, 1.5);
    }
    ctx.restore();
  }

  _drawLock(ctx) {
    ctx.save();

    // 根据不同状态计算门锁透明度与光晕参数
    let lockOpacity;
    let drawGlow = false;
    let glowRadius = 50;
    const dist = this._getFingerDist();
    const isNear = this.fingerActive && dist < 100;
    const isClose = this.fingerActive && dist < 35;

    if (this.timeoutRevealed) {
      // 超时自动高亮：大脉冲
      const pulse = 0.5 + 0.5 * Math.sin(this.time * 4);
      lockOpacity = 0.7 + pulse * 0.15;
      glowRadius = 70 + pulse * 30;
      drawGlow = true;
    } else if (isClose) {
      lockOpacity = 0.8;
      drawGlow = true;
      glowRadius = 35;
    } else if (isNear) {
      lockOpacity = 0.3;
      drawGlow = true;
      glowRadius = 50;
    } else {
      lockOpacity = this._getBreathOpacity();
    }

    // 光晕
    if (drawGlow) {
      const glow = ctx.createRadialGradient(this.lockX, this.lockY, 0, this.lockX, this.lockY, glowRadius);
      glow.addColorStop(0, `rgba(196, 160, 96, ${lockOpacity * 0.6})`);
      glow.addColorStop(0.5, `rgba(196, 160, 96, ${lockOpacity * 0.2})`);
      glow.addColorStop(1, 'rgba(196, 160, 96, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(this.lockX, this.lockY, glowRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    // 门锁本身（小圆形）
    ctx.fillStyle = `rgba(196, 160, 96, ${lockOpacity})`;
    ctx.beginPath();
    ctx.arc(this.lockX, this.lockY, 18, 0, Math.PI * 2);
    ctx.fill();

    // 门锁轮廓（仅在高亮时可见）
    if (lockOpacity > 0.2) {
      ctx.strokeStyle = `rgba(196, 160, 96, ${lockOpacity * 0.3})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(this.lockX, this.lockY, 18, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 门锁十字标记（钥匙孔示意）
    if (lockOpacity > 0.3) {
      ctx.strokeStyle = `rgba(120, 100, 60, ${lockOpacity * 0.4})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(this.lockX - 5, this.lockY);
      ctx.lineTo(this.lockX + 5, this.lockY);
      ctx.moveTo(this.lockX, this.lockY - 5);
      ctx.lineTo(this.lockX, this.lockY + 5);
      ctx.stroke();
    }

    ctx.restore();
  }

  /** 手指光圈的微弱暖光效果 */
  _drawFingerLight(ctx) {
    ctx.save();
    const grad = ctx.createRadialGradient(this.fingerX, this.fingerY, 20, this.fingerX, this.fingerY, 140);
    grad.addColorStop(0, 'rgba(200, 180, 140, 0.08)');
    grad.addColorStop(0.4, 'rgba(200, 180, 140, 0.03)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.game.width, this.game.height);
    ctx.restore();
  }

  /** 超时 50~60s 的月光效果 */
  _drawWarmLight(ctx) {
    ctx.save();

    const progress = this.warmLightProgress;
    const radius = 200 + progress * 1000;  // 200 → 1200
    const centerX = 100;
    const centerY = 100;

    const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
    grad.addColorStop(0, `rgba(255, 230, 160, ${progress * 0.15})`);
    grad.addColorStop(0.3, `rgba(255, 220, 150, ${progress * 0.08})`);
    grad.addColorStop(0.6, `rgba(220, 200, 140, ${progress * 0.04})`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.game.width, this.game.height);
    ctx.restore();
  }

  _drawSearchUI(ctx) {
    const { width, height } = this.game;

    ctx.save();
    const dist = this._getFingerDist();
    const isNear = this.fingerActive && dist < 100;
    const isClose = this.fingerActive && dist < 35;

    // 靠近门锁时的提示
    if (isClose) {
      drawPrompt(ctx, '咔嗒……', this.lockX, this.lockY - 45, 0.3);
    } else if (isNear) {
      drawPrompt(ctx, '似乎摸到了什么……', width / 2, height - 30, 0);
    } else if (!this.fingerActive) {
      drawPrompt(ctx, '伸出手，在黑暗中摸索', width / 2, height - 30, 0);
    }

    // 月光提示
    if (this.moonHintShown) {
      ctx.fillStyle = 'rgba(255, 230, 180, 0.5)';
      ctx.font = '18px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillText('月光照了进来……', width - 30, height - 30);
    }

    // 超时提示
    if (this.timeoutRevealed) {
      ctx.fillStyle = 'rgba(255, 230, 180, 0.7)';
      ctx.font = 'bold 20px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('门就在那里……点击任意位置打开', width / 2, height / 2 + 100);
    }

    ctx.restore();
  }

  // ---------- 开门动画 ----------

  renderFound(ctx) {
    const { width, height } = this.game;

    // 暖光从门锁扩散
    const progress = this.openProgress;
    const radius = 18 + progress * 800;

    ctx.fillStyle = '#0a0806';
    ctx.fillRect(0, 0, width, height);

    // 从门锁位置扩散暖光
    ctx.save();
    const grad = ctx.createRadialGradient(this.lockX, this.lockY, 0, this.lockX, this.lockY, radius);
    grad.addColorStop(0, `rgba(255, 230, 160, ${progress * 0.5})`);
    grad.addColorStop(0.3, `rgba(255, 210, 130, ${progress * 0.3})`);
    grad.addColorStop(0.6, `rgba(220, 180, 100, ${progress * 0.15})`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
    ctx.restore();

    // 门锁淡出
    ctx.save();
    const lockFade = Math.max(0, 1 - progress * 2);
    if (lockFade > 0) {
      ctx.fillStyle = `rgba(196, 160, 96, ${lockFade})`;
      ctx.beginPath();
      ctx.arc(this.lockX, this.lockY, 18, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 开门文字（淡入）
    if (progress > 0.3) {
      ctx.save();
      const textAlpha = Math.min(1, (progress - 0.3) / 0.3);
      ctx.globalAlpha = textAlpha;
      ctx.fillStyle = '#d4b896';
      ctx.font = 'bold 28px system-ui, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('门开了……', width / 2, height / 2);
      ctx.restore();
    }
  }
}


// ---- src/chapters/ch08_sign.js ----
// Ch8 签字——从独立 app 重写为 Chapter 接口

function avg(arr) { return arr.reduce((s, v) => v + s, 0) / arr.length; }

function bbox(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) {
    if (p.x < x0) x0 = p.x;
    if (p.y < y0) y0 = p.y;
    if (p.x > x1) x1 = p.x;
    if (p.y > y1) y1 = p.y;
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

// 笔画分类
function classifyStroke(pts) {
  if (pts.length < 3) return 'dot';
  const bb = bbox(pts);
  const diag = Math.hypot(bb.w, bb.h);
  if (diag < 18) return 'dot';

  const dx = pts[pts.length - 1].x - pts[0].x;
  const dy = pts[pts.length - 1].y - pts[0].y;
  const len = Math.hypot(dx, dy);
  if (len < 12) return 'dot';

  let dirChanges = 0, prevDir = null;
  const step = Math.max(1, Math.floor(pts.length / 8));
  for (let i = step; i < pts.length - step; i += step) {
    const cd = { x: pts[i].x - pts[i - step].x, y: pts[i].y - pts[i - step].y };
    const nd = Math.hypot(cd.x, cd.y);
    if (nd < 4) continue;
    const deg = Math.atan2(cd.y, cd.x) * 57.3;
    if (prevDir !== null && Math.abs(deg - prevDir) > 40) dirChanges++;
    prevDir = deg;
  }
  if (dirChanges >= 2) return 'fold';

  let angle = Math.atan2(dy, dx) * 57.3;
  if (angle < 0) angle += 180;
  const ratio = bb.w / (bb.h || 1);

  if (ratio > 2.2) return 'horizontal';
  if (ratio < 0.45) return 'vertical';
  if (angle < 30 || angle > 150) return 'horizontal';
  if (angle > 65 && angle < 115) return 'vertical';
  if (angle >= 30 && angle <= 65) return 'na';
  if (angle >= 115 && angle <= 150) return 'pie';
  return 'horizontal';
}

// 畸变规则：横↔竖、撇↔捺
function deformStroke(pts, type) {
  if (pts.length < 2) return { deformed: [...pts], type };
  const cx = avg(pts.map(p => p.x)), cy = avg(pts.map(p => p.y));
  switch (type) {
    case 'horizontal':
    case 'vertical':
      return {
        type: type === 'horizontal' ? 'vertical' : 'horizontal',
        deformed: pts.map(p => ({ x: cx + (p.y - cy), y: cy - (p.x - cx) })),
      };
    case 'pie':
      return { type: 'na', deformed: pts.map(p => ({ x: cx - (p.x - cx), y: p.y })) };
    case 'na':
      return { type: 'pie', deformed: pts.map(p => ({ x: cx - (p.x - cx), y: p.y })) };
    default:
      return { deformed: [...pts], type };
  }
}

class Chapter08 {
  constructor(game) {
    this.game = game;
    this.DW = 1280; this.DH = 720;
    this.strokes = [];
    this.cur = [];
    this.wDown = false;
    this.wPid = null;
    this.attempts = 0;
    this.passed = false;
    this.hintShown = false;
    this.elapsed = 0;
    this.totalDT = 0;

    // 纸张纹理
    this.texture = [];
    for (let i = 0; i < 120; i++) {
      this.texture.push({ x: Math.random() * this.DW, y: Math.random() * this.DH, r: 0.3 + Math.random() * 2.8, a: 0.015 + Math.random() * 0.04 });
    }

    this.MAX_ATTEMPTS = 5;
    this.PASS_SCORE = 80;
    this.TIMEOUT_SEC = 10;
    this._completed = false;

    // 缩放参数
    const imgW = 1448, imgH = 1086;
    const sc = Math.max(this.DW / imgW, this.DH / imgH);
    const cropIx = 910, cropIy = 772, cropIw = 510, cropIh = 118;
    this.cropCx = cropIx * sc; this.cropCy = cropIy * sc + (this.DH - imgH * sc) / 2;
    this.cropW = cropIw * sc; this.cropH = cropIh * sc;
    this.zoomScale = Math.min(this.DW / this.cropW, this.DH / this.cropH) * 0.96;
    this.targetCx = 1240 * sc; this.targetCy = 806 * sc + (this.DH - imgH * sc) / 2;

    // 阶段
    this.phase = 'sign'; // sign → zoom → writing
    this.phaseTime = 0;
    this.zoomT = 0;
    this.zoomF = 0;
    this.waitT = 0;
    this.timeoutActive = false;
    this.timeoutFired = false;
  }

  get isComplete() { return this._completed; }
  get completeTitle() { return '辨认成功'; }
  get completeMessage() { return '李向阳'; }

  onEnter() {
    this.game.input.setHandlers({
      down: p => this.handleDown(p),
      move: p => this.handleMove(p),
      up: p => this.handleUp(p),
      cancel: () => this.handleCancel(),
    });
    this.phase = 'sign';
    this.phaseTime = 0;
  }

  onExit() {
    this.game.input.setHandlers();
    if (this.timeoutTimer) clearInterval(this.timeoutTimer);
  }

  handleDown(point) {
    if (this.phase === 'writing' && !this.passed) {
      this.wDown = true;
      this.wPid = point.pointerId;
      this.cur = [point];
      return;
    }
    // 检查弹层按钮（超时/提示/通过）
    this.checkButtonClick(point);
  }

  handleMove(point) {
    if (this.phase === 'writing' && this.wDown && point.pointerId === this.wPid) {
      const last = this.cur[this.cur.length - 1];
      if (Math.hypot(point.x - last.x, point.y - last.y) < 1.5) return;
      this.cur.push(point);
    }
  }

  handleUp(point) {
    if (this.phase !== 'writing' || !this.wDown) return;
    this.wDown = false;
    this.wPid = null;
    if (this.cur.length >= 4) {
      const type = classifyStroke(this.cur);
      const { deformed } = deformStroke(this.cur, type);
      this.strokes.push({ raw: [...this.cur], deformed, type });
    }
    this.cur = [];
  }

  handleCancel() {
    this.wDown = false;
    this.wPid = null;
    this.cur = [];
  }

  checkButtonClick(point) {
    // "清除"按钮
    const cw = 90, ch = 36, cx = this.DW - cw - 20 - 124, cy = this.DH - ch - 16;
    if (point.x >= cx && point.x <= cx + cw && point.y >= cy && point.y <= cy + ch) {
      this.strokes = [];
      this.cur = [];
      return;
    }
    // "提交"按钮
    const bw = 110, bh = 40, bx = this.DW - bw - 20, by = this.DH - bh - 16;
    if (point.x >= bx && point.x <= bx + bw && point.y >= by && point.y <= by + bh) {
      this.submit();
      return;
    }
    // 弹层按钮
    if (this.timeoutFired) {
      this.timeoutFired = false;
      this.elapsed = 0;
      this.totalDT = 0;
      try { navigator.vibrate?.(10); } catch {}
      return;
    }
    if (this.showHint) {
      this.showHint = false;
      try { navigator.vibrate?.(10); } catch {}
      return;
    }
    if (this._completed) {
      this.resetAll();
      return;
    }
  }

  submit() {
    if (this.passed || this.strokes.length < 5) return;
    if (this.matchSignature()) {
      this.passed = true;
      this._completed = true;
      this.game.progress.markChapterComplete(8, 72);
      try { navigator.vibrate?.(15); } catch {}
      return;
    }
    this.attempts++;
    if (this.attempts >= this.MAX_ATTEMPTS && !this.hintShown) {
      this.hintShown = true;
      this.showHint = true;
    }
  }

  matchSignature() {
    const all = this.strokes.map(s => s.raw);
    if (all.length < 6) return false;
    const zones = [[], []];
    for (const pts of all) {
      zones[Math.min(1, Math.floor((avg(pts.map(p => p.x)) / this.DW) * 2))].push(pts);
    }
    if (zones[0].length < 3 || zones[1].length < 3) return false;
    let sc = 0;
    let z0h = false, z0v = false, z0f = false;
    for (const pts of zones[0]) {
      const t = classifyStroke(pts);
      if (t === 'horizontal') z0h = true;
      if (t === 'vertical') z0v = true;
      if (t === 'fold') z0f = true;
    }
    sc += Math.min(20, zones[0].length * 4);
    if (z0h && z0v && z0f) sc += 18;
    else if (z0h && z0v) sc += 12;

    let z1h = false, z1v = false;
    for (const pts of zones[1]) {
      const t = classifyStroke(pts);
      if (t === 'horizontal') z1h = true;
      if (t === 'vertical') z1v = true;
    }
    sc += Math.min(20, zones[1].length * 4);
    if (z1h && z1v) sc += 18;
    else if (z1h || z1v) sc += 8;
    if (z0h && z0v && z1h && z1v) sc += 10;
    sc += Math.min(8, Math.max(0, all.length - 6));
    return sc >= this.PASS_SCORE;
  }

  resetAll() {
    this.strokes = [];
    this.cur = [];
    this.attempts = 0;
    this.passed = false;
    this.hintShown = false;
    this.elapsed = 0;
    this.totalDT = 0;
    this.timeoutActive = false;
    this.timeoutFired = false;
    this.showHint = false;
    this._completed = false;
    this.phase = 'sign';
    this.phaseTime = 0;
    this.zoomT = 0;
    this.zoomF = 0;
    this.waitT = 0;
  }

  update(dt) {
    this.totalDT += dt;

    // phase transitions
    if (this.phase === 'sign') {
      this.phaseTime += dt;
      if (this.phaseTime >= 2.5) {
        this.phase = 'zoom';
        this.phaseTime = 0;
      }
    } else if (this.phase === 'zoom') {
      this.phaseTime += dt;
      const DUR = 1.6;
      const raw = Math.min(1, this.phaseTime / DUR);
      this.zoomT = raw < 0.5 ? 4 * raw * raw * raw : 1 - Math.pow(-2 * raw + 2, 3) / 2;
      this.zoomF = raw > 0.6 ? Math.min(1, 1 - Math.pow(1 - (raw - 0.6) / 0.4, 2)) : 0;
      if (raw >= 1) {
        this.phase = 'writing';
        this.elapsed = 0;
        this.timeoutActive = true;
        this.timeoutFired = false;
      }
    } else if (this.phase === 'writing' && this.timeoutActive && !this.passed) {
      this.totalDT += dt;
      // 用 totalDT 的方式计时（简化：每10次 update 约1秒）
      // 改用 dt 累加
      const prevElapsed = this.elapsed;
      this.elapsed += dt;
      const newSec = Math.floor(this.elapsed);
      const prevSec = Math.floor(prevElapsed);
      if (this.elapsed >= this.TIMEOUT_SEC && !this.timeoutFired) {
        this.timeoutFired = true;
      }
    }
  }

  render(ctx) {
    ctx.clearRect(0, 0, this.DW, this.DH);

    if (this.phase === 'sign') {
      this.renderSign(ctx);
    } else if (this.phase === 'zoom') {
      this.renderZoom(ctx);
    } else {
      this.renderPaper(ctx);
      this.renderWriting(ctx);

      // 按钮
      this.drawButton(ctx, this.DW - 90 - 20 - 124, this.DH - 36 - 16, 90, 36, '清除', '#b89a72');
      this.drawButton(ctx, this.DW - 110 - 20, this.DH - 40 - 16, 110, 40, '提 交', '#f5e6c8', '#4d3420');
    }

    // 弹层
    if (this.timeoutFired) this.renderOverlay(ctx, '时间过了许久', '连笔写——手记得的，疾病夺不走', '再试试');
    if (this.showHint) this.renderOverlay(ctx, '笔迹畸变规则', '横↔竖、撇↔捺，试试连笔写', '明白了');
    if (this._completed) this.renderOverlay(ctx, '辨认成功', '——\n李向阳', '再写一次', true);
  }

  renderSign(ctx) {
    // 优先使用走廊场景底图作为背景
    const bg = this.game.images.ch8_corridor;
    if (bg) {
      const iw = 1280, ih = 720;
      const sc = Math.max(this.DW / (bg.width || iw), this.DH / (bg.height || ih));
      const ox = (this.DW - (bg.width || iw) * sc) / 2;
      const oy = (this.DH - (bg.height || ih) * sc) / 2;
      ctx.drawImage(bg, ox, oy, (bg.width || iw) * sc, (bg.height || ih) * sc);
      // 暗色遮罩保证表单可读
      ctx.fillStyle = 'rgba(10, 6, 4, 0.45)';
      ctx.fillRect(0, 0, this.DW, this.DH);
    }

    const img = this.game.images.sign;
    if (!img) return;
    const iw = 1448, ih = 1086;
    const sc = Math.max(this.DW / iw, this.DH / ih);
    const ox = (this.DW - iw * sc) / 2, oy = (this.DH - ih * sc) / 2;
    ctx.drawImage(img, ox, oy, iw * sc, ih * sc);
  }

  renderZoom(ctx) {
    const img = this.game.images.sign;
    if (!img) return;
    const iw = 1448, ih = 1086;
    const sc = Math.max(this.DW / iw, this.DH / ih);
    const t = this.zoomT;
    const s = 1 + (this.zoomScale - 1) * t;
    const camX = this.DW / 2 + (this.targetCx - this.DW / 2) * t;
    const camY = this.DH / 2 + (this.targetCy - this.DH / 2) * t;
    let tx = this.DW / 2 - camX * s, ty = this.DH / 2 - camY * s;

    ctx.save();
    ctx.translate(tx, ty);
    ctx.scale(s, s);
    const ox = (this.DW - iw * sc) / 2, oy = (this.DH - ih * sc) / 2;
    ctx.drawImage(img, ox, oy, iw * sc, ih * sc);
    ctx.restore();
  }

  renderPaper(ctx) {
    // 优先使用真实纸张纹理底图
    const paper = this.game.images.paperBase;
    const noise = this.game.images.paperNoise;
    if (paper) {
      ctx.drawImage(paper, 0, 0, this.DW, this.DH);
    } else {
      const g = ctx.createLinearGradient(0, 0, this.DW * 0.4, this.DH);
      g.addColorStop(0, '#fcf5e6'); g.addColorStop(0.4, '#f7ecd0');
      g.addColorStop(0.7, '#f2e2bc'); g.addColorStop(1, '#e8d4a0');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, this.DW, this.DH);
    }
    // 纸张噪点叠加
    if (noise) {
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.drawImage(noise, 0, 0, this.DW, this.DH);
      ctx.restore();
    }

    for (const d of this.texture) {
      ctx.fillStyle = `rgba(139,105,20,${d.a})`;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  renderWriting(ctx) {
    for (const s of this.strokes) this.drawInk(ctx, s.deformed, false);
    if (this.cur.length >= 2) this.drawInk(ctx, this.cur, true);
  }

  drawInk(ctx, pts, ghost) {
    if (pts.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 2) {
      ctx.lineTo(pts[1].x, pts[1].y);
    } else {
      for (let i = 1; i < pts.length - 1; i++) {
        const mid = { x: (pts[i].x + pts[i + 1].x) / 2, y: (pts[i].y + pts[i + 1].y) / 2 };
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mid.x, mid.y);
      }
      ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    }
    ctx.strokeStyle = ghost ? 'rgba(30,16,8,0.18)' : '#1a0e06';
    ctx.lineWidth = ghost ? 2 : 2.6;
    ctx.stroke();
    ctx.restore();
  }

  drawButton(ctx, x, y, w, h, text, bgColor, textColor) {
    ctx.save();
    const r = 8;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fillStyle = bgColor;
    ctx.fill();
    ctx.fillStyle = textColor || '#1f1409';
    ctx.font = '600 16px "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
    ctx.restore();
  }

  renderOverlay(ctx, title, message, btnText, isPass) {
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, this.DW, this.DH);

    const cardW = 380, cardH = 280;
    const cx = (this.DW - cardW) / 2, cy = (this.DH - cardH) / 2;

    ctx.beginPath();
    const r = 16;
    ctx.moveTo(cx + r, cy);
    ctx.lineTo(cx + cardW - r, cy);
    ctx.quadraticCurveTo(cx + cardW, cy, cx + cardW, cy + r);
    ctx.lineTo(cx + cardW, cy + cardH - r);
    ctx.quadraticCurveTo(cx + cardW, cy + cardH, cx + cardW - r, cy + cardH);
    ctx.lineTo(cx + r, cy + cardH);
    ctx.quadraticCurveTo(cx, cy + cardH, cx, cy + cardH - r);
    ctx.lineTo(cx, cy + r);
    ctx.quadraticCurveTo(cx, cy, cx + r, cy);
    ctx.closePath();

    const grad = ctx.createLinearGradient(cx, cy, cx, cy + cardH);
    grad.addColorStop(0, '#fcf5e6');
    grad.addColorStop(1, '#f0deb4');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.fillStyle = isPass ? '#2d6e2d' : '#2a1a0c';
    ctx.font = isPass ? 'bold 24px "PingFang SC", system-ui, sans-serif' : 'bold 22px "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(title, this.DW / 2, cy + 55);

    ctx.fillStyle = '#4d3420';
    ctx.font = '17px "PingFang SC", system-ui, sans-serif';
    const lines = message.split('\n');
    lines.forEach((line, i) => {
      ctx.fillText(line, this.DW / 2, cy + 110 + i * 28);
    });

    // 按钮
    const btnW = 180, btnH = 44, bx = (this.DW - btnW) / 2, by = cy + cardH - 50 - btnH / 2;
    ctx.beginPath();
    const br = 8;
    ctx.moveTo(bx + br, by - btnH / 2);
    ctx.lineTo(bx + btnW - br, by - btnH / 2);
    ctx.quadraticCurveTo(bx + btnW, by - btnH / 2, bx + btnW, by - btnH / 2 + br);
    ctx.lineTo(bx + btnW, by + btnH / 2 - br);
    ctx.quadraticCurveTo(bx + btnW, by + btnH / 2, bx + btnW - br, by + btnH / 2);
    ctx.lineTo(bx + br, by + btnH / 2);
    ctx.quadraticCurveTo(bx, by + btnH / 2, bx, by + btnH / 2 - br);
    ctx.lineTo(bx, by - btnH / 2 + br);
    ctx.quadraticCurveTo(bx, by - btnH / 2, bx + br, by - btnH / 2);
    ctx.closePath();
    ctx.fillStyle = '#4d3420';
    ctx.fill();
    ctx.fillStyle = '#fcf5e6';
    ctx.font = '600 16px "PingFang SC", system-ui, sans-serif';
    ctx.fillText(btnText, bx + btnW / 2, by);

    ctx.restore();
  }
}

// 音符数据结构
const NOTES = [
  { id: 'do',  label: 'Do',  color: '#e8a840', targetX: 340, targetY: 360 },
  { id: 're',  label: 'Re',  color: '#d4746c', targetX: 440, targetY: 360 },
  { id: 'mi',  label: 'Mi',  color: '#a890c8', targetX: 540, targetY: 360 },
  { id: 'fa',  label: 'Fa',  color: '#7db8a0', targetX: 640, targetY: 360 },
  { id: 'sol', label: 'Sol', color: '#6898c8', targetX: 740, targetY: 360 },
];

const NOTE_W = 60;
const NOTE_H = 80;
const DW = 1280;
const DH = 720;

// 绘制单个音符碎片
function drawNote(ctx, x, y, w, h, color, label, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha !== undefined ? alpha : 1.0;

  // 椭圆头：音符上半部
  ctx.beginPath();
  ctx.ellipse(x + w / 2, y + h * 0.35, w * 0.4, h * 0.35, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();

  // 竖线：从椭圆底部向下
  ctx.beginPath();
  ctx.moveTo(x + w * 0.6, y + h * 0.6);
  ctx.lineTo(x + w * 0.6, y + h * 0.95);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.stroke();

  // 小旗标：从竖线顶部向右画小曲线
  ctx.beginPath();
  ctx.moveTo(x + w * 0.6, y + h * 0.6);
  ctx.quadraticCurveTo(x + w * 0.9, y + h * 0.5, x + w * 0.75, y + h * 0.68);
  ctx.quadraticCurveTo(x + w * 0.9, y + h * 0.75, x + w * 0.6, y + h * 0.78);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();

  // label：底部居中写字母
  ctx.fillStyle = 'white';
  ctx.font = '14px system-ui, "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(label, x + w / 2, y + h - 4);

  ctx.restore();
}

class Chapter09 {
  constructor(game) {
    this.game = game;
    this._completed = false;
    this.state = 'playing'; // playing → complete
    this.completeAnimTime = 0;

    // 为每个音符初始化散落位置
    this.notes = NOTES.map(n => {
      const offsetX = (Math.random() > 0.5 ? 1 : -1) * (80 + Math.random() * 70);
      const offsetY = (Math.random() > 0.5 ? 1 : -1) * (80 + Math.random() * 70);
      let cx = n.targetX + offsetX;
      let cy = n.targetY + offsetY;
      // 确保不跑到画面外
      cx = Math.max(30, Math.min(1250 - NOTE_W, cx));
      cy = Math.max(50, Math.min(670 - NOTE_H, cy));
      return {
        ...n,
        currentX: cx,
        currentY: cy,
        placed: false,
      };
    });

    // 拖拽状态
    this.dragging = false;
    this.dragIndex = -1;
    this.dragOffsetX = 0;
    this.dragOffsetY = 0;
  }

  get isComplete() { return this._completed; }
  get completeTitle() { return '记忆的风铃'; }
  get completeMessage() { return 'Do Re Mi Fa Sol……风铃响了。'; }

  onEnter() {
    this.game.input.setHandlers({
      down: p => this.handleDown(p),
      move: p => this.handleMove(p),
      up: p => this.handleUp(p),
      cancel: () => this.handleCancel(),
    });
  }

  onExit() {
    this.game.input.setHandlers();
  }

  handleDown(point) {
    if (this.state !== 'playing') return;

    // 从最上层（数组末尾）开始检测
    for (let i = this.notes.length - 1; i >= 0; i--) {
      const n = this.notes[i];
      if (n.placed) continue;
      const halfW = NOTE_W / 2;
      const halfH = NOTE_H / 2;
      if (
        point.x >= n.currentX &&
        point.x <= n.currentX + NOTE_W &&
        point.y >= n.currentY &&
        point.y <= n.currentY + NOTE_H
      ) {
        this.dragging = true;
        this.dragIndex = i;
        this.dragOffsetX = point.x - n.currentX;
        this.dragOffsetY = point.y - n.currentY;
        break;
      }
    }
  }

  handleMove(point) {
    if (!this.dragging || this.dragIndex < 0) return;
    const n = this.notes[this.dragIndex];
    n.currentX = point.x - this.dragOffsetX;
    n.currentY = point.y - this.dragOffsetY;
  }

  handleUp(point) {
    if (!this.dragging || this.dragIndex < 0) return;
    this.dragging = false;
    const n = this.notes[this.dragIndex];
    const dist = Math.hypot(n.currentX - n.targetX, n.currentY - n.targetY);
    if (dist < 50) {
      // 吸附到目标位置
      n.currentX = n.targetX;
      n.currentY = n.targetY;
      n.placed = true;
      // 震动反馈
      try { navigator.vibrate?.(15); } catch {}
    }
    this.dragIndex = -1;

    // 检查是否全部归位
    if (this.notes.every(no => no.placed)) {
      this.state = 'complete';
      this.completeAnimTime = 0;
      this._completed = true;
      this.game.progress.markChapterComplete(9, 85);
    }
  }

  handleCancel() {
    this.dragging = false;
    this.dragIndex = -1;
  }

  update(dt) {
    if (this.state === 'complete') {
      this.completeAnimTime += dt;
    }
  }

  render(ctx) {
    ctx.clearRect(0, 0, DW, DH);

    // 1. 优先使用真实阳台场景底图，加载失败回退程序化渐变
    const balcImg = this.game.images.ch9_balcony;
    if (balcImg) {
      const sc = Math.max(DW / (balcImg.width || 1280), DH / (balcImg.height || 720));
      const ox = (DW - (balcImg.width || 1280) * sc) / 2;
      const oy = (DH - (balcImg.height || 720) * sc) / 2;
      ctx.drawImage(balcImg, ox, oy, (balcImg.width || 1280) * sc, (balcImg.height || 720) * sc);
      // 暗色遮罩保证音符可读性
      ctx.fillStyle = 'rgba(12, 8, 6, 0.42)';
      ctx.fillRect(0, 0, DW, DH);
    } else {
      const bgGrad = ctx.createLinearGradient(0, 0, 0, DH);
      bgGrad.addColorStop(0, '#2a1810');
      bgGrad.addColorStop(0.5, '#3d2018');
      bgGrad.addColorStop(1, '#5a3028');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, DW, DH);
    }

    // 2. 风铃管（真实素材替代程序化窗框线条）
    const pipesImg = this.game.images.ch9_pipes;
    if (pipesImg) {
      const pw = pipesImg.width, ph = pipesImg.height;
      const scP = Math.min(DW / pw, 350 / ph); // 缩放到合适大小放在顶部
      const px = (DW - pw * scP) / 2;
      const py = 10;
      ctx.drawImage(pipesImg, px, py, pw * scP, ph * scP);
    } else {
      // 回退：程序化窗框
      ctx.save();
      ctx.strokeStyle = '#4a3020';
      ctx.lineWidth = 4;
      ctx.strokeRect(40, 30, 1200, 200);
      ctx.beginPath();
      ctx.moveTo(40, 130); ctx.lineTo(1240, 130);
      ctx.moveTo(660, 30); ctx.lineTo(660, 230);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(40, 55); ctx.lineTo(1240, 55);
      ctx.moveTo(40, 80); ctx.lineTo(1240, 80);
      ctx.stroke();
      ctx.restore();
    }

    // 3. 吊线：从窗框底部垂下 5 条细线，对应音符目标位置
    ctx.save();
    ctx.strokeStyle = '#6a5040';
    ctx.lineWidth = 1.2;
    for (const n of this.notes) {
      // 线从窗框底部（y=230）到音符目标位置的上端（targetY - NOTE_H/2）
      const topY = 230;
      const bottomY = n.targetY + NOTE_H * 0.35; // 连到椭圆头中心高度
      ctx.beginPath();
      ctx.moveTo(n.targetX + NOTE_W / 2, topY);
      ctx.lineTo(n.targetX + NOTE_W / 2, bottomY);
      ctx.stroke();
    }
    ctx.restore();

    // 4. 目标槽位虚线框
    for (const n of this.notes) {
      ctx.save();
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(200, 180, 160, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(n.targetX, n.targetY, NOTE_W, NOTE_H, 6);
      ctx.stroke();
      ctx.restore();
    }

    // 5. 已归位的音符（在目标位置）
    for (const n of this.notes) {
      if (n.placed) {
        // 完成后的风铃摆动动画
        if (this.state === 'complete' && this.completeAnimTime < 1.5) {
          const swing = Math.sin(this.completeAnimTime * 8) * 6 * (1 - this.completeAnimTime / 1.5);
          ctx.save();
          ctx.translate(n.currentX + NOTE_W / 2, n.currentY + NOTE_H * 0.35);
          ctx.rotate(swing * Math.PI / 180);
          drawNote(ctx, -NOTE_W / 2, -NOTE_H * 0.35, NOTE_W, NOTE_H, n.color, n.label);
          ctx.restore();
        } else {
          drawNote(ctx, n.currentX, n.currentY, NOTE_W, NOTE_H, n.color, n.label);
        }
      }
    }

    // 6. 未归位的音符（在散落位置或拖拽位置）
    for (let i = 0; i < this.notes.length; i++) {
      const n = this.notes[i];
      if (n.placed || i === this.dragIndex) continue;
      drawNote(ctx, n.currentX, n.currentY, NOTE_W, NOTE_H, n.color, n.label);
    }

    // 7. 拖拽中的音符（最上层）
    if (this.dragging && this.dragIndex >= 0) {
      const n = this.notes[this.dragIndex];
      ctx.save();
      ctx.shadowColor = 'rgba(255, 220, 160, 0.4)';
      ctx.shadowBlur = 16;
      drawNote(ctx, n.currentX, n.currentY, NOTE_W, NOTE_H, n.color, n.label);
      ctx.restore();
    }

    // 8. 提示文字
    drawPrompt(ctx, '将音符拖拽到风铃上', DW / 2, DH - 40, 0);
  }
}


// ---- src/chapters/ch10_report.js ----


const CHAPTERS = [
  { id: 1, title: '序曲·镜前', memory: 5 },
  { id: 2, title: '接女儿放学', memory: 15 },
  { id: 3, title: '迷途', memory: 22 },
  { id: 4, title: '警局', memory: 30 },
  { id: 5, title: '归家迷途', memory: 40 },
  { id: 6, title: '餐桌上的博弈', memory: 52 },
  { id: 7, title: '惊悚夜醒', memory: 60 },
  { id: 8, title: '自我和解', memory: 72 },
  { id: 9, title: '风铃', memory: 85 },
  { id: 10, title: '认出·不迷路', memory: 100 },
];

class Chapter10 {
  constructor(game) {
    this.game = game;

    // 状态机
    this.phase = 'porridge'; // porridge → fadeout → report（终态，不推进下一章）
    this.phaseTime = 0;
    this.totalTime = 0;

    // 蒸汽粒子
    this.steam = [];
    // 点击热区（粥碗中心 + 半径）
    this.bowlCx = 640;
    this.bowlCy = 500;
    this.bowlRx = 140;
    this.bowlRy = 60;
    this.bowlHitRadius = 150;

    // 重新开始按钮
    this.restartBtn = { x: 550, y: 660, w: 180, h: 42 };
  }

  get isComplete() { return false; } // 终章，永远不推进

  onEnter() {
    this._initSteam();
    this.phase = 'porridge';
    this.phaseTime = 0;
    this.totalTime = 0;

    this.game.input.setHandlers({
      down: point => this.handleDown(point),
      move: () => {},
      up: () => {},
      cancel: () => {},
    });
  }

  onExit() {
    this.game.input.setHandlers();
  }

  _initSteam() {
    // 生成 10~15 个蒸汽粒子
    const count = 10 + Math.floor(Math.random() * 6);
    this.steam = [];
    for (let i = 0; i < count; i++) {
      this.steam.push({
        x: this.bowlCx + (Math.random() - 0.5) * this.bowlRx * 1.2,
        y: this.bowlCy - 40 + (Math.random() - 0.5) * 30,
        speed: 25 + Math.random() * 35,
        drift: (Math.random() - 0.5) * 40,
        life: Math.random(),
        phase: Math.random() * Math.PI * 2,
        size: 5 + Math.random() * 8,
      });
    }
  }

  handleDown(point) {
    if (this.phase === 'porridge') {
      // 点击粥碗热区 → 进入 fadeout
      const dist = Math.hypot(point.x - this.bowlCx, point.y - this.bowlCy);
      if (dist <= this.bowlHitRadius) {
        this.phase = 'fadeout';
        this.phaseTime = 0;
      }
    } else if (this.phase === 'report') {
      // 点击"重新开始"按钮
      const btn = this.restartBtn;
      if (point.x >= btn.x && point.x <= btn.x + btn.w &&
          point.y >= btn.y && point.y <= btn.y + btn.h) {
        this.game.progress.reset();
        setTimeout(() => {
          this.game.chapterManager.switchTo('ch01'); // 回到序曲，不跳过ch01
        }, 100);
      }
    }
  }

  update(dt) {
    this.totalTime += dt;
    this.phaseTime += dt;

    switch (this.phase) {
      case 'porridge':
        this._updateSteam(dt);
        break;
      case 'fadeout':
        // 白色遮罩 2s 过渡完成 → 进入 report
        if (this.phaseTime >= 2.0) {
          this.phase = 'report';
          this.phaseTime = 0;
        }
        break;
      case 'report':
        // 无更新逻辑，静态报告页
        break;
    }
  }

  _updateSteam(dt) {
    for (const s of this.steam) {
      s.life += dt * 0.35;
      if (s.life > 1) {
        // 重置到粥面
        s.life = 0;
        s.x = this.bowlCx + (Math.random() - 0.5) * this.bowlRx * 1.2;
        s.y = this.bowlCy - 40;
      }
      // 向上飘
      s.y -= s.speed * dt;
      // 水平漂移
      s.x += Math.sin(s.life * Math.PI * 2 + s.phase) * s.drift * dt;
    }
  }

  render(ctx) {
    switch (this.phase) {
      case 'porridge':
        this._renderPorridge(ctx);
        break;
      case 'fadeout':
        this._renderPorridge(ctx);
        this._renderFadeout(ctx);
        break;
      case 'report':
        this._renderReport(ctx);
        break;
    }
  }

  // ========================
  // 阶段1：porridge - 桌上热粥
  // ========================

  _renderPorridge(ctx) {
    const { width, height } = this.game;

    // 优先使用真实客厅晨光场景底图
    const bgImg = this.game.images.ch10_livingroom;
    if (bgImg) {
      drawImageCover(ctx, bgImg, width, height);
      // 暗色遮罩保证互动元素可读性
      ctx.fillStyle = 'rgba(18, 10, 6, 0.38)';
      ctx.fillRect(0, 0, width, height);
    } else {
      // 回退：暖色调室内渐变
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#3d2018');
      bgGrad.addColorStop(1, '#1a0e06');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);
    }

    // 木桌（画面下方深棕色矩形条，约 1280×80）
    const tableY = height - 80;
    ctx.fillStyle = '#2a1508';
    ctx.fillRect(0, tableY, width, 80);

    // 木纹线条
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    for (let y = tableY + 6; y < height - 4; y += 9) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }

    // 桌面高光
    ctx.fillStyle = 'rgba(255,240,220,0.04)';
    ctx.fillRect(0, tableY, width, 3);

    // 碗：优先使用真实热粥素材图，回退程序化绘制
    const bowlImg = this.game.images.ch10_porridge;
    if (bowlImg) {
      const bw = bowlImg.width, bh = bowlImg.height;
      const scB = Math.min(250 / bw, 180 / bh);
      const bx = this.bowlCx - bw * scB / 2;
      const by = this.bowlCy - bh * scB / 2;
      ctx.drawImage(bowlImg, bx, by, bw * scB, bh * scB);
    } else {
      // 程序化瓷碗
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 6;
      ctx.fillStyle = '#f5ecd7';
      ctx.beginPath();
      ctx.ellipse(this.bowlCx, this.bowlCy, this.bowlRx, this.bowlRy, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 碗口边缘高光
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(this.bowlCx, this.bowlCy - 2, this.bowlRx - 4, this.bowlRy - 4, 0, 0, Math.PI * 2);
      ctx.stroke();

      // 粥面
      ctx.fillStyle = '#e8d5b0';
      ctx.beginPath();
      ctx.ellipse(this.bowlCx, this.bowlCy - 6, this.bowlRx - 16, this.bowlRy - 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // 粥面纹理细节
      ctx.strokeStyle = 'rgba(200,180,150,0.15)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const sx = this.bowlCx + Math.cos(angle) * (this.bowlRx - 30);
        const sy = this.bowlCy - 6 + Math.sin(angle) * (this.bowlRy - 15);
        ctx.beginPath();
        ctx.ellipse(sx, sy, 10, 5, angle, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 蒸汽粒子
    ctx.save();
    for (const s of this.steam) {
      // 透明度呼吸：根据 life 做正弦
      const alpha = Math.sin(s.life * Math.PI) * 0.25;
      if (alpha <= 0) continue;
      ctx.fillStyle = `rgba(240, 230, 210, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * (0.6 + 0.4 * Math.sin(s.life * Math.PI * 3)), 0, Math.PI * 2);
      ctx.fill();

      // 柔和发光
      const glowAlpha = alpha * 0.3;
      ctx.fillStyle = `rgba(240, 230, 210, ${glowAlpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 提示文字
    drawPrompt(ctx, '桌上有一碗热粥……喝下去吧。', width / 2, 620, 0);
  }

  // ========================
  // 阶段2：fadeout - 白色遮罩过渡
  // ========================

  _renderFadeout(ctx) {
    const { width, height } = this.game;
    const alpha = Math.min(1, this.phaseTime / 2.0);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.fillRect(0, 0, width, height);
  }

  // ========================
  // 阶段3：report - 记忆报告页
  // ========================

  _renderReport(ctx) {
    const { width, height } = this.game;

    // 底板：优先使用 report_base.png 素材，加载失败回退程序化纸张
    const baseImg = this.game.images.reportBase;
    if (baseImg && !baseImg._placeholder) {
      drawImageCover(ctx, baseImg, width, height);
    } else {
      // 纸张底色：米黄色做旧纸张 #f5ecd7
      ctx.fillStyle = '#f5ecd7';
      ctx.fillRect(0, 0, width, height);

      // 纸张纹理：散布 60 个微小噪点（#d4c4a0 色调，opacity 0.03~0.08）
      ctx.save();
      const seed = 42; // 固定种子，使噪点每次一致
      for (let i = 0; i < 60; i++) {
        const nx = ((i * 137 + seed * 73) % width);
        const ny = ((i * 251 + seed * 97) % height);
        const opacity = 0.03 + (i % 6) * 0.01;
        ctx.fillStyle = `rgba(212, 196, 160, ${opacity})`;
        ctx.beginPath();
        ctx.arc(nx, ny, 1.5 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // --- 标题区 ---
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // "记忆报告" 大字
    ctx.fillStyle = '#2a1a0c';
    ctx.font = 'bold 36px "PingFang SC", system-ui, sans-serif';
    ctx.fillText('记忆报告', width / 2, 60);

    // 分隔线
    ctx.strokeStyle = '#c4a878';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo((width - 300) / 2, 92);
    ctx.lineTo((width + 300) / 2, 92);
    ctx.stroke();

    ctx.restore();

    // --- 10章列表 ---
    const progress = this.game.progress.load() || { chapter: 1, memory: 0, completed: [] };
    const completed = progress.completed || [];

    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    const listStartY = 130;
    const lineHeight = 48;

    for (let i = 0; i < CHAPTERS.length; i++) {
      const ch = CHAPTERS[i];
      const y = listStartY + i * lineHeight;
      const isCompleted = completed.includes(ch.id);

      // 当前行高亮（如果已完成或当前章节）
      if (isCompleted) {
        ctx.save();
        ctx.fillStyle = 'rgba(196, 168, 120, 0.2)';
        roundedRect(ctx, 180, y - lineHeight / 2 + 2, 860, lineHeight - 4, 6);
        ctx.fill();
        ctx.restore();
      }

      // 序号+标题 (x:200)
      ctx.save();
      if (isCompleted) {
        ctx.fillStyle = '#2a1a0c';
      } else {
        ctx.fillStyle = '#b8a488';
      }
      ctx.font = '500 20px "PingFang SC", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const label = `${String(ch.id).padStart(2, '0')} ${ch.title}`;
      ctx.fillText(label, 200, y);

      // 状态标记 (x:1000)
      ctx.textAlign = 'right';
      ctx.font = '500 20px "PingFang SC", system-ui, sans-serif';
      if (isCompleted) {
        ctx.fillStyle = '#2a1a0c';
        ctx.fillText('✅', 1000, y);
      } else {
        ctx.fillStyle = '#b8a488';
        ctx.fillText('◻', 1000, y);
      }
      ctx.restore();

      // 记忆值标签（左侧边距区域显示 memory 数值）
      ctx.save();
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      if (isCompleted) {
        ctx.fillStyle = '#8a7a60';
      } else {
        ctx.fillStyle = '#d0c0a0';
      }
      ctx.font = '14px "PingFang SC", system-ui, sans-serif';
      ctx.fillText(`${ch.memory}%`, 170, y);
      ctx.restore();
    }

    ctx.restore();

    // --- 记忆值进度条 (y:610) ---
    ctx.save();

    const memory = progress.memory || 0;
    const barX = 340;
    const barY = 610;
    const barW = 600;
    const barH = 20;
    const barR = 10;

    // 标签
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#2a1a0c';
    ctx.font = '500 18px "PingFang SC", system-ui, sans-serif';
    ctx.fillText('记忆恢复进度', 200, barY + barH / 2);

    // 进度条背景
    ctx.fillStyle = '#e0d0b0';
    roundedRect(ctx, barX, barY, barW, barH, barR);
    ctx.fill();

    // 进度条填充
    const fillW = Math.min(barW, (barW * memory) / 100);
    if (fillW > 0) {
      const fillGrad = ctx.createLinearGradient(barX, barY, barX + fillW, barY);
      fillGrad.addColorStop(0, '#c4a060');
      fillGrad.addColorStop(1, '#8B6914');
      ctx.fillStyle = fillGrad;
      roundedRect(ctx, barX, barY, fillW, barH, barR);
      ctx.fill();
    }

    // 百分比数字（右侧）
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#2a1a0c';
    ctx.font = 'bold 22px "PingFang SC", system-ui, sans-serif';
    ctx.fillText(`${memory}%`, barX + barW + 15, barY + barH / 2);

    ctx.restore();

    // --- "重新开始" 按钮 (y:660) ---
    ctx.save();

    const btn = this.restartBtn;
    // 圆角矩形
    ctx.shadowColor = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#4d3420';
    roundedRect(ctx, btn.x, btn.y, btn.w, btn.h, 21);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // 按钮文字
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 18px "PingFang SC", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('重新开始', btn.x + btn.w / 2, btn.y + btn.h / 2);

    ctx.restore();
  }
}
