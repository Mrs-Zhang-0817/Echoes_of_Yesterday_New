<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smile Detection Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'PingFang SC', system-ui, sans-serif;
    color: #eee;
  }
  h1 { margin-bottom: 12px; font-size: 22px; color: #f0d78c; }
  #status { margin-bottom: 16px; font-size: 16px; color: #aaa; }
  .container { position: relative; border-radius: 50%; overflow: hidden; box-shadow: 0 0 40px rgba(180,140,80,0.3); }
  #video { display: block; transform: scaleX(-1); width: 480px; height: 480px; object-fit: cover; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .meter { margin-top: 16px; width: 400px; }
  .meter-label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
  .meter-bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 4px; transition: width 0.1s; background: #f0d78c; }
  .meter-fill.active { background: #4caf50; }
  .info { margin-top: 20px; font-size: 12px; color: #666; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<h1>😊 微笑检测 Demo</h1>
<div id="status">初始化中...</div>
<div class="container">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>
<div class="meter">
  <div class="meter-label"><span>😐 中性</span><span>微笑阈值 (60%)</span><span>😄 微笑</span></div>
  <div class="meter-bar"><div id="meterFill" class="meter-fill" style="width:0%"></div></div>
</div>
<div class="info">
  face-api.js · TinyFaceDetector + FaceExpression<br>
  对着镜头微笑试试 | 达到阈值持续 1.5s 触发
</div>

<script type="importmap">
{
  "imports": {
    "face-api.js": "https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"
  }
}
</script>
<script type="module">
import * as faceapi from 'face-api.js';

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const meterFill = document.getElementById('meterFill');

const DETECT_INTERVAL = 200;  // 每 200ms 检测一次
const HAPPY_THRESHOLD = 0.6;
const HOLD_DURATION = 1500;   // 持续 1.5s 触发
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';

let modelsLoaded = false;
let detectTimer = null;
let smileStartTime = 0;
let triggered = false;

// 加载模型
async function loadModels() {
  statusEl.textContent = '加载模型中...';
  try {
    await faceapi.nets.tinyFaceDetector.load(MODEL_URL);
    await faceapi.nets.faceExpressionNet.load(MODEL_URL);
    modelsLoaded = true;
    statusEl.textContent = '模型就绪，启动摄像头...';
  } catch (err) {
    statusEl.textContent = '模型加载失败: ' + err.message;
    console.error(err);
  }
}

// 启动摄像头
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width: { ideal: 480 },
        height: { ideal: 480 },
      },
    });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = '😐 直视镜头，试试微笑';
    startDetection();
  } catch (err) {
    statusEl.textContent = '摄像头启动失败: ' + err.message;
    console.error(err);
  }
}

// 开始检测循环
function startDetection() {
  detectTimer = setInterval(async () => {
    if (!modelsLoaded || video.readyState < 2) return;

    try {
      const result = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320 }))
        .withFaceExpressions();

      if (result?.expressions) {
        const happy = result.expressions.happy || 0;
        updateMeter(happy);
        checkTrigger(happy);
      }
    } catch (err) {
      // 静默跳过单帧错误
    }
  }, DETECT_INTERVAL);
}

// 更新进度条
function updateMeter(happy) {
  const pct = Math.min(100, happy * 100);
  meterFill.style.width = pct + '%';
  meterFill.className = 'meter-fill' + (happy >= HAPPY_THRESHOLD ? ' active' : '');
}

// 检查触发条件
function checkTrigger(happy) {
  if (triggered) return;

  if (happy >= HAPPY_THRESHOLD) {
    if (smileStartTime === 0) {
      smileStartTime = Date.now();
    }
    const elapsed = Date.now() - smileStartTime;
    const remaining = Math.ceil((HOLD_DURATION - elapsed) / 1000);
    statusEl.textContent = `😊 保持微笑... ${remaining > 0 ? remaining + 's' : '触发！'}`;

    if (elapsed >= HOLD_DURATION) {
      triggered = true;
      statusEl.textContent = '🎉 微笑检测通过！镜中的是你自己。';
      meterFill.style.width = '100%';
      meterFill.className = 'meter-fill active';
      clearInterval(detectTimer);
    }
  } else {
    if (smileStartTime > 0) {
      statusEl.textContent = '😐 再来一次，保持微笑';
    }
    smileStartTime = 0;
  }
}

// 启动
(async () => {
  await loadModels();
  await startCamera();
})();
</script>
</body>
</html>
