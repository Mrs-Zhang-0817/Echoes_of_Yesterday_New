<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>昨日重现</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden;
      position: fixed; top: 0; left: 0;
      background: #0d0805;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; }

    /* ---- Canvas ---- */
    canvas {
      display: none;
      position: absolute;
      touch-action: none;
    }

    /* ---- Loading 遮罩 ---- */
    #loading {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d0805;
      color: #d4b896;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .title { font-size: clamp(18px, 4vw, 28px); margin-bottom: 16px; letter-spacing: 0.1em; }
    #loading .bar-wrap {
      width: min(200px, 40vw); height: 3px;
      background: rgba(212,184,150,0.2);
      border-radius: 2px; overflow: hidden;
    }
    #loading .bar-fill {
      height: 100%; width: 0%;
      background: #d4b896;
      border-radius: 2px;
      transition: width 0.3s;
    }
    #loading .hint { font-size: clamp(11px, 2vw, 14px); margin-top: 12px; opacity: 0.6; }

    /* ============================================
       主菜单
       ============================================ */
    #mainMenu {
      position: fixed;
      z-index: 200;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 45%, #50311c, #170c07 75%);
      font-family: "STKaiti", "KaiTi", "PingFang SC", serif;
    }

    .menu-stage {
      position: relative;
      width: min(100vw, calc(100svh * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      background: #2a180e;
      box-shadow: 0 18px 50px rgba(18, 8, 3, .58);
    }

    .scene-art {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    .menu {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 34.03%;
      width: 33.594%;
      display: grid;
      gap: 2px;
      transform: translateX(-50%);
    }

    .asset-button {
      --sprite-y: 0;
      position: relative;
      width: 100%;
      height: 65px;
      padding: 0;
      border: 0;
      appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .asset-button[data-sprite="start"] {
      height: 76px;
      --sprite-y: 0px;
    }
    .asset-button[data-sprite="continue"] { --sprite-y: -79px; }
    .asset-button[data-sprite="chapters"] { --sprite-y: -146px; }
    .asset-button[data-sprite="capsule"]   { --sprite-y: -213px; }
    .asset-button[data-sprite="settings"] { --sprite-y: -280px; }

    .asset-button[disabled] .button-sprite {
      opacity: 0.35;
    }

    .button-sprite {
      position: absolute;
      z-index: 2;
      inset: 0;
      background: url("assets/pictures/按钮图.png") center var(--sprite-y) / 430px auto no-repeat;
      pointer-events: none;
    }

    /* ---- 竖屏提示 ---- */
    @media (orientation: portrait) {
      #mainMenu::after {
        content: "请横握手机";
        position: fixed;
        z-index: 100;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f4ddb0;
        background: #25140b;
        font-size: 22px;
        letter-spacing: .12em;
      }
    }

    /* ---- 移动端适配 ---- */
    @media (max-height: 560px) {
      .asset-button { height: 9.03vh; }
      .asset-button[data-sprite="start"] { height: 10.55vh; }
      .button-sprite { background-size: 59.72vh auto; }
      .asset-button[data-sprite="continue"] { --sprite-y: -10.97vh; }
      .asset-button[data-sprite="chapters"] { --sprite-y: -20.28vh; }
      .asset-button[data-sprite="capsule"]   { --sprite-y: -29.58vh; }
      .asset-button[data-sprite="settings"] { --sprite-y: -38.89vh; }
    }

    /* ---- 弹层动画 ---- */
    @keyframes menuFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- ===== 主菜单 ===== -->
  <div id="mainMenu">
    <div class="menu-stage">
      <img class="scene-art" src="assets/pictures/主界面底图.jpg" alt="" draggable="false">
      <nav class="menu" aria-label="主菜单">
        <button class="asset-button" id="BTN_START_MEMORY" data-sprite="start" aria-label="开始回忆">
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
        <button class="asset-button" id="BTN_CONTINUE" data-sprite="continue" aria-label="继续昨日" disabled>
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
        <button class="asset-button" id="BTN_CHAPTERS" data-sprite="chapters" aria-label="章节选择">
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
        <button class="asset-button" id="BTN_CAPSULE" data-sprite="capsule" aria-label="时间胶囊">
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
        <button class="asset-button" id="BTN_SETTINGS" data-sprite="settings" aria-label="设置">
          <span class="button-sprite" aria-hidden="true"></span>
        </button>
      </nav>
    </div>
  </div>

  <!-- ===== Loading 遮罩 ===== -->
  <div id="loading">
    <div class="title">昨日重现</div>
    <div class="bar-wrap"><div class="bar-fill" id="loadBar"></div></div>
    <div class="hint" id="loadHint">正在准备记忆碎片...</div>
  </div>

  <!-- ===== Canvas ===== -->
  <canvas id="gameCanvas" aria-label="昨日重现"></canvas>

  <!-- ===== 脚本 ===== -->
  <script src="assets/vendor/face-api/face-api.min.js"></script>
  <script src="src/ui/MainMenu.js"></script>
  <script type="module" src="src/main_new.js"></script>
</body>
</html>
