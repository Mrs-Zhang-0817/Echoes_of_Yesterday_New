<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>签字 — 昨日重现</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1008;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:absolute;touch-action:none}
#msg{position:fixed;z-index:2;pointer-events:none;font-size:clamp(13px,2.5vw,17px);color:#d4b896;letter-spacing:.04em;text-align:center;left:50%;transform:translateX(-50%);bottom:clamp(16px,4vh,40px);opacity:0;transition:opacity .6s;background:rgba(26,16,8,.5);padding:8px 20px;border-radius:6px}
#msg.show{opacity:1}
#timer{position:fixed;z-index:2;pointer-events:none;font-size:clamp(12px,2vw,15px);color:rgba(212,184,150,.5);right:clamp(12px,3vw,24px);top:clamp(12px,3vh,24px);opacity:0;transition:opacity .5s}
#timer.show{opacity:1}#timer.urgent{color:#e8a078}
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.overlay.active{opacity:1;visibility:visible}
.card{background:linear-gradient(145deg,#fcf5e6,#f0deb4);border-radius:16px;padding:28px 32px;max-width:88%;width:380px;text-align:center;box-shadow:0 8px 48px rgba(0,0,0,.5)}
.card h3{font-size:clamp(18px,4vw,24px);color:#2a1a0c;margin-bottom:10px}
.card p{font-size:clamp(14px,2.8vw,17px);color:#4d3420;line-height:1.7;margin-bottom:8px}
.rules{text-align:left;margin:12px 0;padding:14px 18px;background:rgba(42,26,12,.06);border-radius:10px}
.rules li{font-size:clamp(15px,3vw,19px);color:#2a1a0c;margin:7px 0;list-style:none;font-weight:600}
.rules li span{color:#8b6914;margin:0 6px}
.card button{margin-top:12px;padding:11px 44px;border:none;border-radius:8px;background:#4d3420;color:#fcf5e6;font-size:16px;font-weight:600;cursor:pointer}
.card button:active{opacity:.8}
.passCard h3{color:#2d6e2d}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="msg"></div>
<div id="timer"></div>

<div id="timeoutOverlay" class="overlay">
  <div class="card"><h3>时间过了许久</h3><p>记忆越来越模糊……</p><p style="font-size:15px;opacity:.8">有些记忆刻在手上——<b>连笔</b>写下去，疾病抢不走</p><button id="timeoutOk">再试试</button></div>
</div>
<div id="hintOverlay" class="overlay">
  <div class="card"><h3>笔迹畸变规则</h3><p>纸上墨迹在扭曲——</p><ul class="rules"><li>横 ↔ 竖</li><li>撇 ↔ 捺</li><li>点、折 ➔ 不变</li></ul><p style="font-size:14px;opacity:.65">有些记忆刻在手上——连笔写下去</p><button id="hintOk">明白了</button></div>
</div>
<div id="passOverlay" class="overlay">
  <div class="card passCard"><h3>辨认成功</h3><p>——<br><strong style="font-size:120%">李向阳</strong></p><button id="passReset">再写一次</button></div>
</div>

<script>
const DW=1280,DH=720,MAX_ATTEMPTS=5,PASS_SCORE=80,TIMEOUT_SEC=10;
// ── 裁剪区：以「走失人员签字」右侧空白为中心 ──
// 图片中标签在 x~920-1050,y~795-820，空白签字区在其右侧 x~1080-1390,y~775-840
const CROP={ix:910,iy:772,iw:510,ih:118}; // 图片坐标，紧包签名行
// 转为画布坐标
const sc=Math.max(DW/1448,DH/1086);
const ox=0,oy=(DH-1086*sc)/2;
const cropCx=CROP.ix*sc+ox,cropCy=CROP.iy*sc+oy;
const cropW=CROP.iw*sc,cropH=CROP.ih*sc;
// 放大到全屏的缩放系数（留 4% 边缘呼吸）
const zoomScale=Math.min(DW/cropW,DH/cropH)*0.96;
// ── 缩放目标中心：空白签字区的中心（而非裁剪矩形几何中心）──
// 空白区在裁剪内偏右，图片坐标约 (1250, 806)
const TARGET_CENTER_IMG={x:1240,y:806};
const targetCx=TARGET_CENTER_IMG.x*sc+ox,targetCy=TARGET_CENTER_IMG.y*sc+oy;

const S={
  phase:'init',bgImg:null,signTimer:null,zT:0,zF:0,waitT:0,
  strokes:[],cur:[],wDown:false,wPid:null,attempts:0,passed:false,
  hintShown:false,timeoutTimer:null,timeoutShown:false,elapsed:0,
};

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const msgEl=document.getElementById('msg'),timerEl=document.getElementById('timer');
let vpW=0,vpH=0,offX=0,offY=0,dpr=1;

function resize(){
  dpr=window.devicePixelRatio||1;
  vpW=window.innerWidth;vpH=window.innerHeight;
  const s=Math.min(vpW/DW,vpH/DH),dw=DW*s,dh=DH*s;
  offX=(vpW-dw)/2;offY=(vpH-dh)/2;
  canvas.width=Math.round(DW*dpr);canvas.height=Math.round(DH*dpr);
  canvas.style.cssText=`width:${dw}px;height:${dh}px;left:${offX}px;top:${offY}px;position:absolute;touch-action:none`;
  ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
window.addEventListener('resize',resize);
function logical(e){const r=canvas.getBoundingClientRect(),s=Math.min(vpW/DW,vpH/DH);return{x:(e.clientX-r.left)/s,y:(e.clientY-r.top)/s};}
function msg(t,e){if(!t){msgEl.classList.remove('show');return;}msgEl.textContent=t;msgEl.style.color=e?'#e8a078':'#d4b896';msgEl.classList.add('show');}
function updTimer(){timerEl.textContent=S.phase==='writing'?`${Math.max(0,TIMEOUT_SEC-S.elapsed)}s`:'';timerEl.classList.toggle('show',S.phase==='writing');timerEl.classList.toggle('urgent',TIMEOUT_SEC-S.elapsed<=5);}

canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(S.phase==='writing')wDown(logical(e),e);});
canvas.addEventListener('pointermove',e=>{e.preventDefault();if(S.phase==='writing'&&S.wDown)wMove(logical(e));});
canvas.addEventListener('pointerup',e=>{e.preventDefault();if(S.phase==='writing'&&S.wDown)wUp(e);});
canvas.addEventListener('pointercancel',()=>{if(S.phase==='writing'){S.wDown=false;S.wPid=null;S.cur=[];}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('click',e=>{
  if(S.phase!=='writing')return;
  const p=logical(e),bw=110,bh=40,bx=DW-bw-20,by=DH-bh-16;
  const cw=90,ch=36,cx=DW-cw-20-124,cy=DH-ch-16;
  if(p.x>=cx&&p.x<=cx+cw&&p.y>=cy&&p.y<=cy+ch){S.strokes=[];S.cur=[];draw();msg('');return;}
  if(p.x>=bx&&p.x<=bx+bw&&p.y>=by&&p.y<=by+bh)submit();
});

function bootFlow(){
  msg('');
  // Wait 2.5s showing full sign scene, then zoom into the crop
  S.waitT=0;
  const t0=performance.now();
  function waitTick(now){
    S.waitT=(now-t0)/1000;
    if(S.waitT>=2.5){startZoom();return;}
    draw();
    requestAnimationFrame(waitTick);
  }
  requestAnimationFrame(waitTick);
}

function startZoom(){
  S.phase='zoom';S.zT=0;S.zF=0;
  const DUR=1600; // ms — 镜头推近，从容不迫
  const t0=performance.now();
  function tick(now){
    const raw=Math.min(1,(now-t0)/DUR);
    // ── PPT 级缓动：慢起步 → 匀加速 → 平滑减速 settling ──
    // 自定义 ease-in-out：前后两端柔和，中间有力
    const t=raw<0.5
      ? 4*raw*raw*raw                           // ease-in: cubic 加速段
      : 1-Math.pow(-2*raw+2,3)/2;               // ease-out: cubic 减速段
    S.zT=t;
    // ── 叠纸：最后 40% 时间里渐进淡入（更早开始、更柔和）──
    S.zF=raw>0.6 ? Math.min(1,(raw-0.6)/0.4) : 0;
    // 叠纸 alpha 用独立缓动（ease-out，越往后越快融入）
    S.zF=S.zF<1 ? 1-Math.pow(1-S.zF,2) : 1;
    draw();
    if(raw<1)requestAnimationFrame(tick);
    else{S.zT=1;S.zF=1;S.phase='writing';S.elapsed=0;msg('写下"向阳"');updTimer();startTimeout();draw();}
  }
  requestAnimationFrame(tick);
}

function startTimeout(){
  S.timeoutShown=false;
  if(S.timeoutTimer)clearInterval(S.timeoutTimer);
  S.timeoutTimer=setInterval(()=>{
    if(S.passed||S.phase!=='writing'){clearInterval(S.timeoutTimer);return;}
    S.elapsed++;updTimer();
    if(S.elapsed>=TIMEOUT_SEC&&!S.timeoutShown){S.timeoutShown=true;clearInterval(S.timeoutTimer);document.getElementById('timeoutOverlay').classList.add('active');}
  },1000);
}

const avg=arr=>arr.reduce((s,v)=>v+s,0)/arr.length;
function bbox(p){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const t of p){if(t.x<x0)x0=t.x;if(t.y<y0)y0=t.y;if(t.x>x1)x1=t.x;if(t.y>y1)y1=t.y;}return{x:x0,y:y0,w:x1-x0,h:y1-y0};}
function cls(p){
  if(p.length<3)return'dot';const b=bbox(p);
  if(Math.hypot(b.w,b.h)<18)return'dot';
  const dx=p[p.length-1].x-p[0].x,dy=p[p.length-1].y-p[0].y;
  if(Math.hypot(dx,dy)<12)return'dot';let ch=0,pr=null;const st=Math.max(1,Math.floor(p.length/8));
  for(let i=st;i<p.length-st;i+=st){const c={x:p[i].x-p[i-st].x,y:p[i].y-p[i-st].y};if(Math.hypot(c.x,c.y)<4)continue;const d=Math.atan2(c.y,c.x)*57.3;if(pr!==null&&Math.abs(d-pr)>40)ch++;pr=d;}
  if(ch>=2)return'fold';const r=b.w/(b.h||1);
  if(r>2.2)return'horizontal';if(r<0.45)return'vertical';
  let a=Math.atan2(dy,dx)*57.3;if(a<0)a+=180;
  if(a<30||a>150)return'horizontal';if(a>65&&a<115)return'vertical';
  if(a>=30&&a<=65)return'na';if(a>=115&&a<=150)return'pie';return'horizontal';
}
function deform(pts,type){
  if(pts.length<2)return{pts:[...pts],type};
  const cx=avg(pts.map(p=>p.x)),cy=avg(pts.map(p=>p.y));
  switch(type){
    case'horizontal':case'vertical':return{type:type==='horizontal'?'vertical':'horizontal',pts:pts.map(p=>({x:cx+(p.y-cy),y:cy-(p.x-cx)}))};
    case'pie':return{type:'na',pts:pts.map(p=>({x:cx-(p.x-cx),y:p.y}))};
    case'na':return{type:'pie',pts:pts.map(p=>({x:cx-(p.x-cx),y:p.y}))};
    default:return{pts:[...pts],type};
  }
}
function matchStr(){
  const all=S.strokes.map(s=>s.raw);if(all.length<6)return false;
  const z=[[],[]];for(const p of all){z[Math.min(1,Math.floor((avg(p.map(p=>p.x))/DW)*2))].push(p);}
  if(z[0].length<3||z[1].length<3)return false;
  let sc=0;let z0h=false,z0v=false,z0f=false;
  for(const p of z[0]){const t=cls(p);if(t==='horizontal')z0h=true;if(t==='vertical')z0v=true;if(t==='fold')z0f=true;}
  sc+=Math.min(20,z[0].length*4);if(z0h&&z0v&&z0f)sc+=18;else if(z0h&&z0v)sc+=12;
  let z1h=false,z1v=false;for(const p of z[1]){const t=cls(p);if(t==='horizontal')z1h=true;if(t==='vertical')z1v=true;}
  sc+=Math.min(20,z[1].length*4);if(z1h&&z1v)sc+=18;else if(z1h||z1v)sc+=8;
  if(z0h&&z0v&&z1h&&z1v)sc+=10;sc+=Math.min(8,Math.max(0,all.length-6));
  return sc>=PASS_SCORE;
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function wDown(p,e){if(S.passed)return;canvas.setPointerCapture(e.pointerId);S.wPid=e.pointerId;S.wDown=true;S.cur=[p];msg('');}
function wMove(p){if(dist(p,S.cur[S.cur.length-1])<1.5)return;S.cur.push(p);draw();}
function wUp(e){S.wDown=false;S.wPid=null;try{canvas.releasePointerCapture(e.pointerId);}catch{}if(S.cur.length>=4){const t=cls(S.cur);const{pts}=deform(S.cur,t);S.strokes.push({raw:[...S.cur],deformed:pts,type:t});}S.cur=[];if(S.timeoutShown)msg('连笔写——手记得的，疾病夺不走',true);draw();}
function submit(){
  if(S.passed||S.strokes.length<5){if(S.strokes.length<5)msg('再写几笔',true);return;}
  if(matchStr()){S.passed=true;document.getElementById('passOverlay').classList.add('active');msg('✓ 李向阳');return;}
  S.attempts++;
  if(S.attempts>=MAX_ATTEMPTS&&!S.hintShown){S.hintShown=true;document.getElementById('hintOverlay').classList.add('active');}
  else if(S.attempts>=MAX_ATTEMPTS)msg('手还记得——连笔写下去',true);
  else msg(`不太像 (${S.attempts}/${MAX_ATTEMPTS})`,true);
}
document.getElementById('timeoutOk').addEventListener('click',()=>{document.getElementById('timeoutOverlay').classList.remove('active');msg('连笔写——手记得的，疾病夺不走',true);});
document.getElementById('hintOk').addEventListener('click',()=>{document.getElementById('hintOverlay').classList.remove('active');msg('横↔竖、撇↔捺，或连笔写——手记得',true);});
document.getElementById('passReset').addEventListener('click',()=>{document.getElementById('passOverlay').classList.remove('active');resetAll();});
function resetAll(){
  if(S.timeoutTimer)clearInterval(S.timeoutTimer);
  S.strokes=[];S.cur=[];S.attempts=0;S.passed=false;S.hintShown=false;S.timeoutShown=false;S.elapsed=0;
  S.phase='sign';S.zT=0;S.zF=0;timerEl.classList.remove('show');msg('');draw();bootFlow();
}

// ===================================================================
// Render
// ===================================================================
function rdrSign(){
  const img=S.bgImg;if(!img)return;
  drawFullImg(img);
  // 轻微压暗边缘，引导视线
  ctx.fillStyle='rgba(0,0,0,0.025)';ctx.fillRect(0,0,DW,DH);
  // 签字区提示（柔和虚线框 + 标签）
  ctx.save();
  ctx.strokeStyle='rgba(90,60,30,0.12)';ctx.setLineDash([5,8]);ctx.lineWidth=1;
  ctx.strokeRect(cropCx,cropCy,cropW,cropH);
  ctx.fillStyle='rgba(90,60,30,0.09)';ctx.font='13px "PingFang SC",system-ui,sans-serif';
  ctx.fillText('← 走失人员签字',cropCx+8,cropCy+24);
  ctx.restore();
}

function rdrZoom(){
  const img=S.bgImg;if(!img)return;
  const t=S.zT;
  // ── 镜头推近：相机中心从画布中心平滑移向签字区中心 ──
  const s=1+(zoomScale-1)*t;
  const camX=DW/2+(targetCx-DW/2)*t;
  const camY=DH/2+(targetCy-DH/2)*t;
  let tx=DW/2-camX*s,ty=DH/2-camY*s;
  // ── 视口钳制：图片（canvas 空间 x∈[0,DW], y∈[oy, oy+1086*sc]）必须始终盖满屏幕，不露底色 ──
  const minTx=DW-DW*s,maxTx=0;                    // 图片左缘≤0 且右缘≥DW
  const minTy=DH-(oy+1086*sc)*s,maxTy=-oy*s;      // 图片上缘≤0 且下缘≥DH
  tx=Math.max(minTx,Math.min(maxTx,tx));
  ty=Math.max(minTy,Math.min(maxTy,ty));
  ctx.save();
  ctx.translate(tx,ty);
  ctx.scale(s,s);
  drawFullImg(img);
  ctx.restore();
  // ── 暗角：随放大逐渐加深，模拟镜头聚焦感 ──
  if(t>0.3){
    const vigA=Math.min(0.35,(t-0.3)*0.5);
    const vg=ctx.createRadialGradient(DW/2,DH/2,DH*0.25,DW/2,DH/2,DH*0.7);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(0.7,`rgba(20,12,6,${vigA*0.4})`);
    vg.addColorStop(1,`rgba(20,12,6,${vigA})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,DW,DH);
  }
  // ── 叠纸（渐进交叉淡化）──
  if(S.zF>0.001){
    ctx.globalAlpha=S.zF;
    rdrPaper();
    ctx.globalAlpha=1;
  }
}

function drawFullImg(img){
  const iw=1448,ih=1086;
  const s=Math.max(DW/iw,DH/ih);
  const ox_=(DW-iw*s)/2,oy_=(DH-ih*s)/2;
  ctx.drawImage(img,ox_,oy_,iw*s,ih*s);
}

function rdrPaper(){
  const g=ctx.createLinearGradient(0,0,DW*0.4,DH);
  g.addColorStop(0,'#fcf5e6');g.addColorStop(0.4,'#f7ecd0');g.addColorStop(0.7,'#f2e2bc');g.addColorStop(1,'#e8d4a0');
  ctx.fillStyle=g;ctx.fillRect(0,0,DW,DH);
  for(let i=0;i<150;i++){const x=((i*7919+1234)%1400)/1400*DW,y=((i*6271+5678)%1400)/1400*DH;const r=0.3+((i*7)%5)*0.5,a=0.012+((i*13)%9)*0.003;ctx.fillStyle=`rgba(110,80,40,${a})`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
  const vg=ctx.createRadialGradient(DW/2,DH/2,DH*0.3,DW/2,DH/2,DH*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(0.6,'rgba(0,0,0,0)');vg.addColorStop(0.85,'rgba(100,70,30,0.025)');vg.addColorStop(1,'rgba(100,70,30,0.06)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,DW,DH);
  ctx.save();ctx.strokeStyle='rgba(80,55,25,0.035)';ctx.lineWidth=1.2;ctx.lineCap='round';
  for(let i=0;i<10;i++){const sx=((i*331+77)%1400)/1400*DW,sy=((i*229+43)%1400)/1400*DH;ctx.beginPath();ctx.moveTo(sx,sy);for(let j=1;j<4;j++)ctx.lineTo(sx+((i*377+j*57)%150)/150*35-17,sy+((i*443+j*71)%150)/150*35-17);ctx.stroke();}ctx.restore();
}
function rdrWriting(){
  for(const s of S.strokes){if(s.deformed.length>=2)ink(s.deformed,false);}
  if(S.cur.length>=2)ink(S.cur,true);
  ctx.save();ctx.fillStyle='rgba(100,70,40,0.12)';const cw=90,ch=36,cx=DW-cw-20-124,cy=DH-ch-16;ctx.beginPath();ctx.roundRect(cx,cy,cw,ch,8);ctx.fill();ctx.fillStyle='rgba(61,39,23,0.55)';ctx.font='500 15px "PingFang SC",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('清除',cx+cw/2,cy+ch/2);ctx.restore();
  ctx.save();ctx.fillStyle='rgba(61,39,23,0.85)';const bw=110,bh=40,bx=DW-bw-20,by=DH-bh-16;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,8);ctx.fill();ctx.fillStyle='#f5e6c8';ctx.font='600 16px "PingFang SC",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('提 交',bx+bw/2,by+bh/2);ctx.restore();
}
function ink(pts,g){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);if(pts.length===2){ctx.lineTo(pts[1].x,pts[1].y);}else{for(let i=1;i<pts.length-1;i++){ctx.quadraticCurveTo(pts[i].x,pts[i].y,(pts[i].x+pts[i+1].x)/2,(pts[i].y+pts[i+1].y)/2);}ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);}ctx.strokeStyle=g?'rgba(30,16,8,0.2)':'#1a0e06';ctx.lineWidth=g?2:2.5;ctx.stroke();ctx.restore();}
function draw(){ctx.clearRect(0,0,DW,DH);if(S.phase==='sign'){rdrSign();}else if(S.phase==='zoom'){rdrZoom();}else{rdrPaper();rdrWriting();}}

async function boot(){
  try{S.bgImg=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='./assets/images/sign_scene.png';});}catch{S.bgImg=null;}
  S.phase='sign';resize();bootFlow();
}
boot();
</script>
</body>
</html>
