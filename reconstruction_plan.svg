  <rect x="30" y="255" width="1540" height="120" rx="12" fill="#2d3748" opacity="0.9" filter="url(#shadow)"/>
  <rect x="30" y="255" width="1540" height="32" rx="12" fill="#e94560"/>
  <rect x="30" y="273" width="1540" height="14" fill="#e94560"/>
  <text x="50" y="278" fill="#fff" font-size="16" font-weight="bold">阶段 1：基础设施重建 · 依赖：已审计的信息</text>

  <rect x="60" y="300" width="340" height="60" rx="8" fill="#e94560" opacity="0.15"/>
  <text x="75" y="320" fill="#e2e8f0" font-size="14" font-weight="bold">1.1 清理重复资产</text>
  <text x="75" y="340" fill="#a0aec0" font-size="12">去重 _v2 文件、清理冗余 PNG</text>

  <rect x="430" y="300" width="340" height="60" rx="8" fill="#e94560" opacity="0.15"/>
  <text x="445" y="320" fill="#e2e8f0" font-size="14" font-weight="bold">1.2 更新 assetManifest.js</text>
  <text x="445" y="340" fill="#a0aec0" font-size="12">注册 ~50 个未接入的图片资源</text>

  <rect x="800" y="300" width="340" height="60" rx="8" fill="#e94560" opacity="0.15"/>
