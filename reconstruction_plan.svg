  <rect x="30" y="410" width="1540" height="180" rx="12" fill="#2d3748" opacity="0.9" filter="url(#shadow)"/>
  <rect x="30" y="410" width="1540" height="32" rx="12" fill="#f5a623"/>
  <rect x="30" y="428" width="1540" height="14" fill="#f5a623"/>
