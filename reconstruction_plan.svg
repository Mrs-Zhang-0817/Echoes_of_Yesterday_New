  <text x="1515" y="660" text-anchor="middle" fill="#4ecdc4" font-size="11">~30min</text>
  <line x1="1485" y1="715" x2="1545" y2="715" stroke="#4a5568" stroke-width="1"/>

  <text x="1515" y="795" text-anchor="middle" fill="#667eea" font-size="11">~20min</text>
  <line x1="1485" y1="835" x2="1545" y2="835" stroke="#4a5568" stroke-width="1"/>

