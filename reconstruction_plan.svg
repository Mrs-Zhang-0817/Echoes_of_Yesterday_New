  <text x="800" y="1048" text-anchor="middle" fill="#48bb78" font-size="20" font-weight="bold">🎯 最终产物：ye_v2_douyin.zip（单个 zip，index.html + 内联资源）</text>

  <!-- 右侧时间轴 -->
  <rect x="1470" y="90" width="90" height="975" rx="8" fill="#2d3748" opacity="0.6"/>
