  <text x="800" y="52" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="bold">《昨日重现》→ 抖音互动空间 · 自动化重建路径</text>

  <!-- ========== 阶段 0：信息盘点 ========== -->
  <rect x="30" y="90" width="1540" height="130" rx="12" fill="#2d3748" opacity="0.9" filter="url(#shadow)"/>
  <rect x="30" y="90" width="1540" height="32" rx="12" fill="#4a5568"/>
  <rect x="30" y="108" width="1540" height="14" fill="#4a5568"/>
  <text x="50" y="112" fill="#e2e8f0" font-size="16" font-weight="bold">阶段 0：信息盘点</text>

  <!-- 3个盘点来源 -->
  <rect x="60" y="135" width="470" height="70" rx="8" fill="#e94560" opacity="0.2"/>
  <circle cx="90" cy="170" r="18" fill="#e94560"/>
  <text x="90" y="176" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">①</text>
  <text x="115" y="162" fill="#e2e8f0" font-size="14" font-weight="bold">本地代码资产审计</text>
  <text x="115" y="182" fill="#a0aec0" font-size="12">src/ 113 文件 + assets/images/ 104 图 + assets/sfx/ 20 音频</text>

  <rect x="565" y="135" width="470" height="70" rx="8" fill="#f5a623" opacity="0.2"/>
  <circle cx="595" cy="170" r="18" fill="#f5a623"/>
  <text x="595" y="176" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">②</text>
  <text x="620" y="162" fill="#e2e8f0" font-size="14" font-weight="bold">飞书策划案提取</text>
  <text x="620" y="182" fill="#a0aec0" font-size="12">"昨日重现·漫画剧情互动系统" + 资产台账 + 比赛备忘录</text>

  <rect x="1070" y="135" width="470" height="70" rx="8" fill="#667eea" opacity="0.2"/>
  <circle cx="1100" cy="170" r="18" fill="#667eea"/>
  <text x="1100" y="176" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">③</text>
  <text x="1125" y="162" fill="#e2e8f0" font-size="14" font-weight="bold">Echoes_Of_Yesterday_Rebuilt</text>
  <text x="1125" y="182" fill="#a0aec0" font-size="12">汲取重构版的组织结构和经验</text>

