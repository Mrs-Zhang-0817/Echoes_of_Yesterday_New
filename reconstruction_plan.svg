  <rect x="565" y="804" width="470" height="28" rx="6" fill="#667eea" opacity="0.12"/>
  <text x="580" y="823" fill="#a0aec0" font-size="13">"让我们荡起双桨"5 次出现（Ch1/4/5/9/10）</text>

  <rect x="1070" y="804" width="470" height="28" rx="6" fill="#667eea" opacity="0.12"/>
  <text x="1085" y="823" fill="#a0aec0" font-size="13">AudioContext + 手势解锁 + 缓存池</text>

