  <rect x="1050" y="920" width="490" height="42" rx="8" fill="#48bb78" opacity="0.12"/>
  <text x="1065" y="940" fill="#e2e8f0" font-size="13" font-weight="bold">真机验证</text>
  <text x="1065" y="955" fill="#a0aec0" font-size="11">iOS Safari + Android Chrome 横屏全流程</text>

