  <rect x="1170" y="300" width="370" height="60" rx="8" fill="#e94560" opacity="0.15"/>
  <text x="1185" y="320" fill="#e2e8f0" font-size="14" font-weight="bold">1.4 index.html → 抖音合规格式</text>
  <text x="1185" y="340" fill="#a0aec0" font-size="12">加载遮罩 + 横屏提示 + 错误兜底 + face-api 前置加载</text>

  <!-- 箭头 1→2 -->
  <line x1="800" y1="375" x2="800" y2="403" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrowDown)"/>

